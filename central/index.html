<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bordo:#9a0019; --acc:#ff2d55; --acc2:#ff6b81;
    --bg:#07090d; --bege:#0f131a; --card:#10141c; --card2:#151a24;
    --texto:#e8ebf2; --sub:#8a93a6; --titulo:#6f7a90;
    --linha:rgba(255,255,255,.07); --borda:rgba(255,255,255,.09);
    --verde:#22d37a; --marrom:#f5a524; --vermelho:#ff3b5c; --creme:#ffd166;
    --navy:#3d8bff; --teal:#22d3ee; --amarelo:#facc15; --cinza:#6b7385; --roxo:#a78bfa;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,"Segoe UI",-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(900px 420px at 85% -120px,rgba(154,0,25,.35),transparent 70%),radial-gradient(700px 380px at -10% 10%,rgba(61,139,255,.08),transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
  .hidden{display:none!important}
  button,select,input,textarea{font-family:inherit}
  .wrap{max-width:1180px;margin:0 auto}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#262c38;border-radius:8px}

  /* ---------- Login / carregando ---------- */
  .tela{position:fixed;inset:0;z-index:90;background:inherit;background-color:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
  .faixa{padding:56px 24px 24px;text-align:center;position:relative}
  .faixa img{width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,45,85,.4),0 0 0 10px rgba(255,45,85,.06),0 0 60px rgba(255,45,85,.45);animation:pulsaGlow 3s ease-in-out infinite}
  .faixa h1{font-size:26px;font-weight:800;letter-spacing:-.3px;margin-top:20px}
  .faixa h1::after{content:"_";color:var(--acc);animation:pisca 1s steps(1) infinite}
  .faixa p{font-family:var(--mono);font-size:11px;color:var(--sub);margin-top:8px;letter-spacing:2.5px;text-transform:uppercase}
  .caixa{background:rgba(16,20,28,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--borda);border-radius:16px;padding:24px 22px;
    width:calc(100% - 32px);max-width:380px;margin:8px auto 24px;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden}
  .caixa::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
  .caixa h2{font-family:var(--mono);font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
  .caixa h2::before{content:"› ";color:var(--acc)}
  .lembrar{display:flex;align-items:center;gap:8px;margin:14px 0 16px;font-size:13px;color:var(--sub);cursor:pointer}
  .lembrar input{width:16px;height:16px;accent-color:var(--acc)}
  .msg-erro{color:var(--vermelho);font-size:13px;min-height:18px;margin-top:12px;text-align:center;line-height:1.4}
  .carregando{align-items:center;justify-content:center;gap:18px;font-family:var(--mono)}
  .carregando img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 60px rgba(255,45,85,.5);animation:pulsaGlow 1.4s ease-in-out infinite}
  .carregando #carTxt{color:var(--sub);font-size:12px!important;letter-spacing:2px!important}
  .scan{width:220px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;position:relative}
  .scan::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:varre 1.1s ease-in-out infinite}

  /* ---------- Campos e botões ---------- */
  label.l{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:10px;background:#0b0e14;font-size:14.5px;outline:none;color:var(--texto);transition:border-color .2s,box-shadow .2s}
  input::placeholder,textarea::placeholder{color:#4d5566}
  textarea{resize:vertical;min-height:70px;line-height:1.4}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,45,85,.15)}
  input:disabled{opacity:.5}
  .campo{margin-top:14px}
  .ajuda{font-size:11.5px;color:var(--sub);margin-top:5px}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{padding:12px 18px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:linear-gradient(135deg,#c8102e,var(--bordo));color:#fff;font-size:14px;font-weight:700;cursor:pointer;
    transition:transform .1s,box-shadow .2s,opacity .2s;white-space:nowrap;box-shadow:0 6px 20px rgba(200,16,46,.3),inset 0 1px 0 rgba(255,255,255,.15)}
  .btn:hover{box-shadow:0 8px 28px rgba(255,45,85,.45),inset 0 1px 0 rgba(255,255,255,.15)}
  .btn:active{transform:scale(.97)} .btn:disabled{opacity:.45}
  .btn.sec{background:rgba(255,255,255,.04);color:var(--texto);border:1px solid var(--borda);box-shadow:none}
  .btn.navy{background:linear-gradient(135deg,#3d8bff,#1d5fd1);box-shadow:0 6px 20px rgba(61,139,255,.25)}
  .btn.verde{background:linear-gradient(135deg,#22d37a,#109956);color:#04130b;box-shadow:0 6px 20px rgba(34,211,122,.25)}
  .btn.mini{padding:7px 12px;font-size:12px;border-radius:8px}
  .btn.full{width:100%}

  /* ---------- Cabeçalho e abas ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(7,9,13,.78);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--borda)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--acc) 30%,var(--teal) 70%,transparent);opacity:.6}
  .topo{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
  .topo img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,45,85,.35),0 0 24px rgba(255,45,85,.35)}
  .topo .t{flex:1;min-width:0}
  .titulo-app{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--sub)}
  .topo h1{font-size:18px;font-weight:800;line-height:1.25;letter-spacing:-.2px}
  .topo small{font-size:12px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sync{font-family:var(--mono);font-size:10.5px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:6px}
  .sync i{width:6px;height:6px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);animation:pisca 2s ease-in-out infinite}
  .ico{background:rgba(255,255,255,.05);border:1px solid var(--borda);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,border-color .2s}
  .ico:hover{background:rgba(255,45,85,.12);border-color:rgba(255,45,85,.4)}
  nav{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .aba{background:transparent;border:1px solid transparent;color:var(--sub);font-weight:600;font-size:13px;padding:7px 12px;cursor:pointer;border-radius:9px;white-space:nowrap;transition:all .2s}
  .aba:hover{color:var(--texto);background:rgba(255,255,255,.04)}
  .aba.on{color:#fff;background:rgba(255,45,85,.12);border-color:rgba(255,45,85,.45);box-shadow:0 0 18px rgba(255,45,85,.18)}
  .aba b{display:inline-block;min-width:18px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.08);font-family:var(--mono);font-size:10.5px;margin-left:5px;color:var(--texto)}
  .aba b.alerta{background:var(--acc);color:#fff;box-shadow:0 0 10px rgba(255,45,85,.6)}

  main{padding:0 16px 110px}
  .secao{display:flex;align-items:center;gap:10px;margin:26px 0 10px;color:var(--sub);font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;white-space:nowrap}
  .secao::before{content:"";width:6px;height:6px;background:var(--acc);border-radius:1px;box-shadow:0 0 8px var(--acc);flex-shrink:0}
  .secao::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--borda),transparent)}
  .secao .btn{margin-left:auto;order:3;font-family:Inter,sans-serif;letter-spacing:0;text-transform:none}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0 18px}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}
  .kpi{--c:var(--navy);position:relative;border-radius:14px;padding:13px 14px;overflow:hidden;cursor:pointer;min-height:104px;display:flex;flex-direction:column;

  .vt.top .vt-pos{color:var(--amarelo);font-size:15px;text-shadow:0 0 10px rgba(250,204,21,.6)}
  .vt.top .vt-barra u{background:linear-gradient(90deg,#109956,var(--verde));box-shadow:0 0 12px var(--verde)}
  .vt.top .vt-cab b{color:#fff}
  .vt-seg{display:flex;gap:14px;margin:6px 0 0 36px;font-family:var(--mono);font-size:10.5px;color:var(--sub)}
  .vt-seg b{color:var(--texto)}
  .ag-dias{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;max-width:360px}
  .ag-dias span{text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--sub);background:rgba(255,255,255,.03);border:1px solid var(--borda);border-radius:6px;padding:3px 0;line-height:1.3}
  .ag-dias span i{display:block;font-style:normal;font-size:12.5px;color:var(--texto)}
  .ag-dias span.tem{border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.07)} .ag-dias span.tem i{color:var(--teal)}
  .filtros .btn.mini{align-self:center}
  /* ---------- Menu lateral ---------- */
  .menu{position:fixed;left:0;top:0;bottom:0;width:264px;z-index:46;background:rgba(9,11,16,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-right:1px solid var(--borda);overflow-y:auto;padding:0 10px 30px;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .menu.on{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .menu::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:1px;background:linear-gradient(180deg,transparent,var(--acc) 30%,var(--teal) 70%,transparent);opacity:.5}
  .menu-topo{display:flex;align-items:center;gap:10px;padding:16px 6px 12px;border-bottom:1px solid var(--borda);margin-bottom:6px}
  .menu-topo img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 18px rgba(255,45,85,.35)}
  .menu-topo b{flex:1;font-size:15px}
  .menu-topo small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--sub);letter-spacing:1.4px;text-transform:uppercase;font-weight:500}
  .menu-fundo{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  .menu-fundo.on{opacity:1;pointer-events:auto}
  #abas{display:block;padding:0;overflow:visible}
  .menu .grupo{font-family:var(--mono);font-size:9.5px;color:var(--titulo);letter-spacing:1.8px;text-transform:uppercase;margin:18px 12px 6px}
  .menu .aba{display:flex;width:100%;align-items:center;gap:11px;text-align:left;padding:10px 12px;margin:2px 0;font-size:14px;font-weight:600}
  .menu .aba svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .menu .aba b{margin-left:auto}
  .menu .aba.on svg{stroke:var(--acc)}
  .menu .sep{height:1px;background:var(--borda);margin:14px 6px}
  .menu .aba.acionar{color:#fff;background:linear-gradient(135deg,rgba(200,16,46,.35),rgba(154,0,25,.2));border-color:rgba(255,45,85,.45);margin-top:10px}
  .bt-menu{flex-shrink:0}
  .menu-fechar{display:flex}
  .pag-tit{display:flex;align-items:baseline;gap:10px;margin:20px 0 2px}
  .pag-tit h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
  .pag-tit span{font-family:var(--mono);font-size:10.5px;color:var(--sub);letter-spacing:1.6px;text-transform:uppercase}
  @media (min-width:1100px){
    body.desk .menu{transform:none}
    body.desk .menu-fechar{display:none}
    body.desk .menu-fundo{display:none}
    body.desk:not(.menu-off) #cab{padding-left:264px}
    body.desk:not(.menu-off) #app{margin-left:264px;max-width:none;padding:0 32px 110px}
    body.desk.menu-off .menu{transform:translateX(-102%)}
  }
  .fundo{z-index:47} .folha{z-index:48}
  .tabela-tg{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
  .tabela-tg th{font-family:var(--mono);font-size:9.5px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;text-align:left;padding:10px 8px;border-bottom:1px solid var(--borda)}
  .tabela-tg td{padding:10px 8px;border-bottom:1px solid var(--linha)}
  .tabela-tg tr:last-child td{border-bottom:0}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
  /* =====================================================================
     HOSPEDAGEM NO GITHUB PAGES: o link /exec do Apps Script fica no arquivo config.js, ao lado deste index.html:
         window.API_URL = 'https://script.google.com/macros/s/.../exec';
     Assim, nas próximas versões é só trocar o index.html, sem colar o link de novo.
     Dentro do próprio Apps Script nada disso é usado: a página usa a ligação direta do Google.
     ===================================================================== */
  const API_URL = window.API_URL || 'COLE_AQUI_O_LINK_EXEC';

  const NO_GOOGLE = !!(window.google && google.script && google.script.run);
  if (!NO_GOOGLE) window.google = { script: { get run(){ return chamadaApi(); } } };
  /** Imita o google.script.run usando fetch para a API (doPost) do Apps Script. */
  function chamadaApi(){
    let ok = () => {}, falha = () => {};
    const h = new Proxy({}, { get(t, fn){
      if (fn === 'withSuccessHandler') return f => { ok = f; return h; };
      if (fn === 'withFailureHandler') return f => { falha = f; return h; };
      return (...args) => {
        if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(API_URL)) return setTimeout(() => falha(new Error('Falta o arquivo config.js com o link /exec do Apps Script, na mesma pasta do index.html.')), 0);
        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
          .then(r => r.json())
          .then(j => j && j.ok ? ok(j.r) : falha(new Error(j && j.erro ? j.erro : 'Resposta inválida do servidor.')))
          .catch(e => falha(new Error('Não consegui falar com o servidor. Confira o link /exec e se a implantação está com acesso "Qualquer pessoa". (' + e.message + ')')));
      };
    } });
    return h;
  }

  const $ = id => document.getElementById(id);
  document.querySelectorAll('img[data-logo]').forEach(i => { i.src = $('logoBase').src; });
  const K_LOGIN = 'centralbi.login', K_SSO = 'merchan.sso';
  let CRED = null, D = null, aba = 'geral';
  const F = { dClass: 'todas', dStatus: 'ativas', dTipo: '', dBusca: '', cForn: '', cStatus: 'abertos', rFiltro: 'todas', relRot: '', relMes: '', relPara: '', vSeg: '', agF: '', tgSup: '', tgTodos: false };

  /* ---------- Utilidades ---------- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  let tT; function toast(t, tipo){ const e = $('toast'); e.textContent = t; e.className = 'toast on ' + (tipo || ''); clearTimeout(tT); tT = setTimeout(() => e.className = 'toast', 3000); }
  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k){ try { localStorage.removeItem(k); } catch (e) {} }
  const toUTC = s => { const p = String(s).slice(0, 10).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };
  const diff = (a, b) => Math.round((toUTC(a) - toUTC(b)) / 86400000);
  const addD = (s, n) => new Date(toUTC(s) + n * 86400000).toISOString().slice(0, 10);
  const dow = s => new Date(toUTC(s)).getUTCDay();
  const br = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
  const brA = s => s ? br(s) + '/' + s.slice(2, 4) : '';
  const SEM = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const seg = () => addD(D.hoje, -((dow(D.hoje) + 6) % 7));
  const opts = (arr, v, vazio) => (vazio != null ? `<option value="">${esc(vazio)}</option>` : '') + arr.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const edita = () => D && D.podeEditar;

  const demFeita = d => d.status === 'Concluída' || d.status === 'Cancelada';
  const chaFeito = c => c.status === 'Concluído' || c.status === 'Cancelado';
  const stCls = s => s === 'Em execução' ? 'exec' : s === 'Pendente' ? 'pend' : /Aguardando/.test(s) ? 'agu' : (s === 'Concluída' ? 'feito' : 'parado');
  const clCls = c => c === 'Ideia futura' ? 'Ideia' : c;
  function farol(prazo, feito, status){
    if (feito) return { cls: 'feito', txt: status || 'Concluído' };
    if (/interromp|cancel/i.test(status || '')) return { cls: 'parado', txt: status };
    if (!prazo) return { cls: 'semprazo', txt: 'Sem prazo' };
    const d = diff(prazo, D.hoje);
    if (d < 0) return { cls: 'atrasado', txt: 'Atrasado ' + (-d) + 'd' };
    if (d === 0) return { cls: 'ultimo', txt: 'Vence hoje' };
    return { cls: 'emdia', txt: d === 1 ? 'Vence amanhã' : 'Em ' + d + ' dias' };
  }

  /* ---------- Login / carga ---------- */
  function mostrar(qual){
    ['login', 'carregando'].forEach(x => $(x).classList.toggle('hidden', x !== qual));
    const app = qual === 'app';
    ['cab', 'app', 'menu'].forEach(x => $(x).classList.toggle('hidden', !app));
    $('fab').classList.toggle('hidden', !app || !temFab());
  }
  function entrar(){
    const email = $('lgEmail').value.trim().toLowerCase(), senha = $('lgSenha').value.trim();
    if (!email || !senha) { $('lgErro').textContent = 'Preencha e-mail e senha.'; return; }
    CRED = { email, senha };
    if ($('lgLembrar').checked) { lsSet(K_LOGIN, CRED); lsSet(K_SSO, CRED); } else lsDel(K_LOGIN);
    $('lgErro').textContent = '';
    carregar();
  }
  function sair(){ lsDel(K_LOGIN); lsDel(K_SSO); CRED = null; D = null; $('lgSenha').value = ''; fecharFolha(); mostrar('login'); }

  let tCarga;
  function erroCarga(msg){
    clearTimeout(tCarga);
    fecharIntro();
    if (/^LOGIN:/.test(msg)) { lsDel(K_LOGIN); if (/inválidos/.test(msg)) lsDel(K_SSO); D = null; mostrar('login'); $('lgErro').textContent = msg.replace(/^LOGIN: ?/, ''); return; }
    if (D) { toast(msg, 'erro'); return; }
    mostrar('carregando');
    $('carTxt').classList.add('hidden'); $('carScan').classList.add('hidden'); $('carErro').classList.remove('hidden'); $('carMsg').innerHTML = msg;
  }
  const MSG_TRAVOU = NO_GOOGLE ? 'O servidor não respondeu.<br><br>Se o navegador estiver com <b>mais de uma conta Google</b> logada, abra numa <b>janela anônima</b>. Confira também se publicou uma <b>Nova versão</b>.'
    : 'O servidor não respondeu em 30 segundos.<br><br>Confira sua conexão e tente de novo. Se persistir, confira se o Apps Script foi publicado como <b>Nova versão</b> com acesso <b>Qualquer pessoa</b>.';
  function carregar(msg){
    clearTimeout(tCarga);
    if (!D) { mostrar('carregando'); $('carTxt').classList.remove('hidden'); $('carScan').classList.remove('hidden'); $('carErro').classList.add('hidden'); abrirIntro(); tCarga = setTimeout(() => erroCarga(MSG_TRAVOU), 30000); }
    google.script.run
      .withSuccessHandler(txt => {
        clearTimeout(tCarga);
        let r; try { r = JSON.parse(txt); } catch (e) { return erroCarga('Resposta inválida do servidor.'); }
        if (r.erro) return erroCarga(esc(r.erro));
        aposIntro(() => { D = r; iniciar(); if (msg) toast(msg, 'ok'); });
      })
      .withFailureHandler(e => erroCarga(esc(e && e.message ? e.message : String(e))))
      .carregarJSON(CRED.email, CRED.senha);
  }
  function chamar(fn, args, ok, btn){
    const t = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Salvando'; }
    google.script.run
      .withSuccessHandler(r => { if (btn) { btn.disabled = false; btn.innerHTML = t; } ok(r); })
      .withFailureHandler(e => { if (btn) { btn.disabled = false; btn.innerHTML = t; } const m = e && e.message ? e.message : String(e); if (/^LOGIN:/.test(m)) return erroCarga(m); toast(m, 'erro'); })[fn](CRED.email, CRED.senha, ...args);
  }

  /* ---------- Montagem ---------- */
  const ABAS_ADM = [['geral', 'Visão geral'], ['semana', 'Minha semana'], ['demandas', 'Demandas'], ['chamados', 'Chamados'],
                    ['rotinas', 'Rotinas'], ['relatorios', 'Relatórios'], ['projetos', 'Projetos'], ['agenda', 'Agenda'], ['votacao', 'Votação'], ['trigold', 'TRI GOLD'], ['solicitacoes', 'Solicitações'], ['links', 'Atalhos'], ['config', '⚙ Configurações']];
  const ABAS_SOL = [['solicitacoes', 'Solicitações'], ['relatorios', 'Relatórios'], ['links', 'Atalhos']];
  const TODAS_VIEWS = ['geral', 'semana', 'demandas', 'chamados', 'rotinas', 'relatorios', 'projetos', 'agenda', 'votacao', 'trigold', 'solicitacoes', 'links', 'config'];
  const abasDo = () => (D.usuario.perfil === 'SOLICITANTE' ? ABAS_SOL : ABAS_ADM).filter(a => (a[0] !== 'config' || D.config) && (a[0] !== 'relatorios' || D.relatorios) && (a[0] !== 'votacao' || D.votacao) && (a[0] !== 'trigold' || D.trigold));

  function iniciar(){
    $('areaTxt').textContent = D.area;
    const per = { ADMIN: 'Administrador', GESTOR: 'Gestor', SOLICITANTE: 'Solicitante' }[D.usuario.perfil];
    $('quemTxt').textContent = D.usuario.nome + ' · ' + per + ' · ' + SEM[dow(D.hoje)] + ', ' + brA(D.hoje);
    $('tagLeitura').classList.toggle('hidden', D.usuario.perfil !== 'GESTOR');
    if (!abasDo().some(a => a[0] === aba)) aba = abasDo()[0][0];
    renderAbas(); renderTudo(); mostrar('app'); irAba(aba, true);
    SYNC = new Date(); relogio();
  }
  let SYNC = null;
  const hh = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  function relogio(){ if (!SYNC) return; const m = Math.round((Date.now() - SYNC) / 60000); $('syncTxt').textContent = 'online · atualizado ' + hh(SYNC) + (m >= 1 ? ' (há ' + m + ' min)' : ''); }
  setInterval(relogio, 30000);
  function renderAbas(){
    const n = {};
    if (D.demandas) {
      n.demandas = D.demandas.filter(d => !demFeita(d)).length;
      n.chamados = D.chamados.filter(c => !chaFeito(c)).length;
      n.rotinas = D.rotinas.filter(r => r.status === 'atrasada' || r.status === 'hoje').length;
      n.semana = itensSemana().filter(i => i.data <= D.hoje).length;
      n.solicitacoes = D.solicitacoes.filter(s => s.status === 'Recebida').length;
    } else n.solicitacoes = D.solicitacoes.filter(s => !/Concluída|Cancelada/.test(s.status)).length;
    const alerta = { rotinas: 1, semana: 1 };
    if (D.trigold && D.trigold.ligado && !D.trigold.erro) n.trigold = D.trigold.pendSup + D.trigold.pendBko || '';
    const tem = {}; abasDo().forEach(([k, t]) => tem[k] = t);
    const bt = k => `<button class="aba ${k === aba ? 'on' : ''}" data-aba="${k}"><svg viewBox="0 0 24 24">${ICO[k] || ''}</svg>${esc(tem[k].replace(/^⚙ /, ''))}${n[k] ? `<b class="${alerta[k] ? 'alerta' : ''}">${n[k]}</b>` : ''}</button>`;
    let html = '';
    GRUPOS.forEach(([g, ks], gi) => { const vis = ks.filter(k => tem[k]); if (!vis.length) return;
      if (gi === GRUPOS.length - 1) html += '<div class="sep"></div>'; else if (g && D.usuario.perfil !== 'SOLICITANTE') html += `<div class="grupo">${g}</div>`;
      html += vis.map(bt).join(''); });
    const soltos = Object.keys(tem).filter(k => !GRUPOS.some(g => g[1].indexOf(k) >= 0)); html += soltos.map(bt).join('');
    if (D.usuario.perfil === 'GESTOR') html += `<button class="aba acionar" data-acao="acionar"><svg viewBox="0 0 24 24">${ICO.acionar}</svg>Acionar o BI</button>`;
    $('abas').innerHTML = html;
  }
  function renderTudo(){
    if (D.demandas) { renderGeral(); renderSemana(); renderDemandas(); renderChamados(); renderRotinas(); renderProjetos(); renderAgenda(); }
    renderSolicitacoes(); renderLinks();
    if (D.relatorios) renderRelatorios();
    if (D.config) renderConfig();
    if (D.votacao) renderVotacao();
    if (D.trigold) renderTrigold();
  }
  function irAba(k, semScroll){
    aba = k;
    document.querySelectorAll('.aba').forEach(b => b.classList.toggle('on', b.dataset.aba === k));
    TODAS_VIEWS.forEach(x => $('v-' + x).classList.toggle('hidden', x !== k));
    $('fab').classList.toggle('hidden', !temFab());
    if (!semScroll) window.scrollTo(0, 0);
    $('pagTit').textContent = nomeAba(k); $('pagGrupo').textContent = grupoDe(k);
    fecharMenu();
  }
  const temFab = () => D && edita() && ['geral', 'semana', 'demandas', 'chamados', 'rotinas', 'projetos', 'relatorios'].indexOf(aba) >= 0;

  /* ---------- Itens com data (Minha semana) ---------- */
  function itensSemana(){
    const h = D.hoje, lim = addD(h, 7), out = [];
    D.demandas.filter(d => !demFeita(d) && d.prazo && d.prazo <= lim).forEach(d => out.push({ data: d.prazo, ic: '📌', tipo: 'Demanda', txt: d.demanda, sub: d.id + (d.solicitante ? ' · ' + d.solicitante : '') + ' · ' + d.status, abrir: () => detDemanda(d) }));
    D.chamados.filter(c => !chaFeito(c) && c.prazo && c.prazo <= lim).forEach(c => out.push({ data: c.prazo, ic: '📨', tipo: 'Chamado', txt: (c.prazo <= h ? 'Cobrar ' : 'Validar com ') + nomeForn(c.fornecedor) + ': ' + c.assunto, sub: c.id + ' · ' + c.status, abrir: () => detChamado(c) }));
    D.rotinas.forEach(r => {
      if (r.status === 'atrasada') out.push({ data: r.dueAberto, ic: '🔁', tipo: 'Rotina', txt: r.rotina, sub: 'Report atrasado · para ' + (r.destinatario || '—'), abrir: () => detRotina(r) });
      r.semana.filter(d => d >= h && !(r.status === 'entregue' && d === r.ultimaOcc)).forEach(d => {
        if (r.status === 'atrasada' && d === r.dueAberto) return;
        out.push({ data: d, ic: '🔁', tipo: 'Rotina', txt: r.rotina, sub: r.frequencia + ' · para ' + (r.destinatario || '—'), abrir: () => detRotina(r) });
      });
    });
    D.projetos.filter(p => p.dataMarco && p.dataMarco <= lim && p.status !== 'Concluído').forEach(p => out.push({ data: p.dataMarco, ic: '🎯', tipo: 'Marco', txt: p.projeto + ': ' + (p.marco || 'marco'), sub: p.fase || p.status, abrir: () => detProjeto(p) }));
    return out.sort((a, b) => a.data.localeCompare(b.data));
  }
  const itemHtml = (i, idx) => `<div class="item" data-i="${idx}"><div class="ic">${i.ic}</div><div class="tx"><b>${esc(i.txt)}</b><small>${esc(i.tipo)} · ${esc(i.sub)}${i.data < D.hoje ? ' · <span style="color:var(--vermelho);font-weight:700">' + (-diff(i.data, D.hoje)) + ' dia(s) de atraso</span>' : ''}</small></div></div>`;
  let ITENS = [];
  function listaItens(arr){ const base = ITENS.length; ITENS = ITENS.concat(arr); return arr.map((i, k) => itemHtml(i, base + k)).join(''); }

  /* ---------- Visão geral ---------- */
  function renderGeral(){
    ITENS = [];
    const h = D.hoje, s0 = seg(), at = D.demandas.filter(d => !demFeita(d));
    const atras = at.filter(d => d.prazo && d.prazo < h);
    const ent7 = D.demandas.filter(d => d.status === 'Concluída' && d.concluida && d.concluida >= addD(h, -6));
    const adOk = D.rotinas.reduce((s, r) => s + r.aderencia.ok, 0), adTot = D.rotinas.reduce((s, r) => s + r.aderencia.total, 0);
    const rotAtr = D.rotinas.filter(r => r.status === 'atrasada').length;
    const chAb = D.chamados.filter(c => !chaFeito(c)), chAt = chAb.filter(c => c.prazo && c.prazo < h);
    const ag = D.agenda || {};
    const kp = (cls, t, v, sub, ir, pct) => `<div class="kpi ${cls}" data-ir="${ir}"><span>${t}</span><b>${v}</b>${sub ? `<small>${sub}</small>` : ''}${pct != null ? `<i class="kbar"><u style="width:${Math.max(0, Math.min(100, pct))}%"></u></i>` : ''}</div>`;
    const semana = itensSemana();
    const atencao = semana.filter(i => i.data <= h).slice(0, 8);
    const exec = at.filter(d => d.status === 'Em execução');
    const bloq = at.filter(d => /Aguardando/.test(d.status));
    const porClass = D.listas.classif.map(c => [c, at.filter(d => d.classificacao === c).length]);
    const porProj = {}; at.forEach(d => { const k = d.projeto || 'Sem projeto'; porProj[k] = (porProj[k] || 0) + 1; });
    const porOrig = {}; at.forEach(d => { const k = d.origem || 'Não informada'; porOrig[k] = (porOrig[k] || 0) + 1; });
    const barras = (pares, cor) => { const mx = Math.max(1, ...pares.map(p => p[1])); return '<div class="barras">' + pares.map(([k, v]) => `<div class="b"><div><span>${esc(k)}</span><b>${v}</b></div><i><u style="width:${Math.round(v / mx * 100)}%;background:${cor || 'var(--acc)'};color:${cor || 'var(--acc)'}"></u></i></div>`).join('') + '</div>'; };
    const ord = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const ult = D.historico.slice().sort((a, b) => b.quando.localeCompare(a.quando)).slice(0, 10);

    $('v-geral').innerHTML = `
      <div class="kpis">
        ${kp('k-navy', 'Demandas ativas', at.length, at.filter(d => d.classificacao === 'Urgente').length + ' urgentes', 'demandas')}
        ${kp('k-teal', 'Em execução', exec.length, bloq.length + ' aguardando terceiros', 'demandas', at.length ? exec.length / at.length * 100 : 0)}
        ${kp('k-verm', 'Atrasadas', atras.length, 'demandas com prazo vencido', 'demandas')}
        ${kp('k-verde', 'Entregues (7 dias)', ent7.length, D.demandas.filter(d => d.status === 'Concluída' && d.concluida >= s0).length + ' nesta semana', 'demandas')}
        ${kp('k-marrom', 'Rotinas no prazo', adTot ? Math.round(adOk / adTot * 100) + '%' : '—', adOk + ' de ' + adTot + ' no mês · ' + rotAtr + ' atrasada(s)', 'rotinas', adTot ? adOk / adTot * 100 : 0)}
        ${kp('k-cinza', 'Chamados abertos', chAb.length, chAt.length + ' com prazo vencido', 'chamados')}
        ${D.votacao && D.votacao.ligado && !D.votacao.erro ? kp('k-marrom', 'Votação · participação', (D.votacao.participantes ? Math.round(D.votacao.votaram / D.votacao.participantes * 100) : 0) + '%', D.votacao.votaram + ' de ' + D.votacao.participantes + ' votaram', 'votacao', D.votacao.participantes ? D.votacao.votaram / D.votacao.participantes * 100 : 0) : ''}
        ${ag.ligado && !ag.erro ? kp('k-navy', 'Agenda enviada', ag.enviaram + '/' + ag.total, 'prazo ' + SEM[dow(ag.prazo)].toLowerCase() + ' ' + br(ag.prazo), 'agenda', ag.total ? ag.enviaram / ag.total * 100 : 0) : ''}
      </div>
      ${edita() ? '<div class="acoes" style="margin-top:14px"><button class="btn sec" data-acao="resumo">Resumo para o gestor</button><button class="btn" data-acao="informe">Informe para a área</button></div>' : ''}
      ${D.usuario.perfil === 'GESTOR' ? blocoPedidosGestor() : ''}
      <div class="secao">Atenção agora</div>
      <div class="bloco">${atencao.length ? listaItens(atencao) : '<div class="vazio">Nada vencido. 👏</div>'}</div>
      <div class="grade">
        <div><div class="secao">Foco: em execução</div><div class="bloco">${exec.length ? listaItens(exec.map(d => ({ data: d.prazo || '9999', ic: '🔧', tipo: d.classificacao, txt: d.demanda, sub: d.id + (d.prazo ? ' · prazo ' + br(d.prazo) : '') + (d.iniciada ? ' · há ' + diff(h, d.iniciada) + 'd' : ''), abrir: () => detDemanda(d) }))) : '<div class="vazio">Nenhuma demanda em execução.</div>'}</div></div>
        <div><div class="secao">Bloqueios</div><div class="bloco">${bloq.length ? listaItens(bloq.map(d => ({ data: '9999', ic: '⏳', tipo: d.status, txt: d.demanda, sub: d.id + (d.chamado ? ' · ' + d.chamado : '') + (d.iniciada ? ' · parado há ' + diff(h, d.iniciada) + 'd' : ''), abrir: () => detDemanda(d) }))) : '<div class="vazio">Nada aguardando terceiros.</div>'}</div></div>
      </div>
      <div class="grade">
        <div><div class="secao">Ativas por classificação</div><div class="bloco">${barras(porClass, 'var(--vermelho)')}</div></div>
        <div><div class="secao">Ativas por projeto</div><div class="bloco">${barras(ord(porProj), 'var(--navy)')}</div></div>
      </div>
      <div class="grade">
        <div><div class="secao">Origem das demandas</div><div class="bloco">${barras(ord(porOrig), 'var(--teal)')}</div></div>
        <div><div class="secao">Últimas atividades</div><div class="bloco timeline">${ult.map(x => `<div class="tl"><time>${br(x.data)} ${x.quando.slice(11, 16)}</time><div><span class="tp">${esc(x.tipo)}</span>${x.ref ? `<span class="id">${esc(x.ref)}</span> ` : ''}${esc(x.texto)}</div></div>`).join('') || '<div class="vazio">Sem atividades.</div>'}</div></div>
      </div>`;
  }

  /* ---------- Minha semana ---------- */
  function renderSemana(){
    const its = itensSemana(), h = D.hoje;
    const atr = its.filter(i => i.data < h);
    let html = `<div class="secao">Agenda de ${br(h)} a ${br(addD(h, 7))}</div>`;
    if (edita()) html += `<div class="bloco"><label class="l" for="feito">O que eu fiz agora?</label>
      <div style="display:flex;gap:8px;margin-top:6px"><textarea id="feito" rows="1" style="min-height:44px" placeholder="Ex.: Validei com a Smart a entrega do chamado"></textarea><button class="btn" data-acao="feito">Registrar</button></div></div>`;
    const base = ITENS.length;
    if (atr.length) html += `<div class="dia-cab atr">Atrasados <span>${atr.length} item(ns)</span></div><div class="bloco">${listaItens(atr)}</div>`;
    for (let k = 0; k <= 7; k++) {
      const d = addD(h, k), arr = its.filter(i => i.data === d);
      html += `<div class="dia-cab ${k === 0 ? 'hoje' : ''}">${k === 0 ? 'Hoje' : k === 1 ? 'Amanhã' : SEM[dow(d)]} · ${br(d)} <span>${arr.length ? arr.length + ' item(ns)' : 'livre'}</span></div>`;
      if (arr.length) html += `<div class="bloco">${listaItens(arr)}</div>`;
    }
    $('v-semana').innerHTML = html;
  }

  /* ---------- Demandas ---------- */
  function renderDemandas(){
    const L = D.listas, h = D.hoje;
    let l = D.demandas.slice();
    if (F.dStatus === 'ativas') l = l.filter(d => !demFeita(d));
    else if (F.dStatus === 'atrasadas') l = l.filter(d => !demFeita(d) && d.prazo && d.prazo < h);
    else if (F.dStatus === 'aguardando') l = l.filter(d => /Aguardando/.test(d.status));
    else if (F.dStatus !== 'todas') l = l.filter(d => d.status === F.dStatus);
    if (F.dClass !== 'todas') l = l.filter(d => d.classificacao === F.dClass);
    if (F.dTipo) l = l.filter(d => d.tipo === F.dTipo);
    const q = F.dBusca.toLowerCase();
    if (q) l = l.filter(d => (d.id + ' ' + d.demanda + ' ' + d.descricao + ' ' + d.solicitante + ' ' + d.projeto + ' ' + d.origem).toLowerCase().includes(q));
    const oc = { Urgente: 0, 'Prioritária': 1, Backlog: 2, 'Ideia futura': 3 }, os = { 'Em execução': 0, Pendente: 1, 'Aguardando solicitante': 2, 'Aguardando fornecedor': 3 };
    l.sort((a, b) => (demFeita(a) - demFeita(b)) || ((oc[a.classificacao] ?? 9) - (oc[b.classificacao] ?? 9)) || ((os[a.status] ?? 9) - (os[b.status] ?? 9)) || (a.prazo || '9999').localeCompare(b.prazo || '9999'));
    if (F.dStatus === 'Concluída') l.sort((a, b) => (b.concluida || '').localeCompare(a.concluida || ''));
    const cont = c => D.demandas.filter(d => !demFeita(d) && (c === 'todas' || d.classificacao === c)).length;
    $('v-demandas').innerHTML = `
      <div class="filtros" data-f="dClass">${['todas'].concat(L.classif).map(c => `<button class="chip ${F.dClass === c ? 'on' : ''}" data-v="${esc(c)}">${c === 'todas' ? 'Todas' : esc(c)} (${cont(c)})</button>`).join('')}</div>
      <div class="linha-f">
        <select data-f="dStatus">${[['ativas', 'Ativas'], ['atrasadas', 'Atrasadas'], ['aguardando', 'Aguardando terceiros']].concat(L.statusDem.map(s => [s, s])).concat([['todas', 'Todas']]).map(([v, t]) => `<option value="${esc(v)}" ${F.dStatus === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
        <select data-f="dTipo">${opts(L.tiposDem, F.dTipo, 'Todos os tipos')}</select>
        <input data-f="dBusca" type="search" placeholder="Buscar ID, demanda, solicitante…" value="${esc(F.dBusca)}">
      </div>
      <div id="listaDem">${l.map(cardDemanda).join('') || '<div class="vazio">Nenhuma demanda neste filtro.</div>'}</div>`;
  }
  function cardDemanda(d){
    const f = farol(d.prazo, demFeita(d), d.status);
    return `<div class="card f-${f.cls}" data-dem="${esc(d.id)}">
      <div class="c-meta" style="margin-top:0"><span class="id">${esc(d.id)}</span><span class="tag t-${clCls(d.classificacao)}">${esc(d.classificacao)}</span><span class="tag t-${stCls(d.status)}">${esc(d.status)}</span><span class="tag t-tipo">${esc(d.tipo)}</span></div>
      <div class="c-tit">${esc(d.demanda)}</div>
      <div class="c-meta">
        ${d.origem ? `<span>↳ ${esc(d.origem)}</span>` : ''}${d.solicitante ? `<span>👤 ${esc(d.solicitante)}</span>` : ''}${d.projeto ? `<span>📁 ${esc(d.projeto)}</span>` : ''}
        ${d.entrega ? `<span>${esc(d.entrega)}</span>` : ''}
        ${!demFeita(d) ? `<span class="tag t-${f.cls}">${esc(f.txt)}</span>` : (d.concluida ? `<span>Concluída em ${br(d.concluida)}</span>` : '')}
        ${d.chamado ? `<span class="tag t-cha">${esc(d.chamado)}</span>` : ''}${d.protocolo ? `<span class="id">${esc(d.protocolo)}</span>` : ''}
      </div></div>`;
  }
  function historicoDe(id){
    const hs = D.historico.filter(x => x.ref === id).sort((a, b) => b.quando.localeCompare(a.quando));
    return `<div class="secao" style="margin-top:16px">Histórico</div>
      ${edita() ? `<div style="display:flex;gap:8px"><textarea id="andTxt" rows="2" style="min-height:44px" placeholder="Registrar andamento…"></textarea><button class="btn navy" data-acao="andamento" data-ref="${esc(id)}">Registrar</button></div>` : ''}
      <div class="bloco timeline">${hs.map(x => `<div class="tl"><time>${brA(x.data)}</time><div><span class="tp">${esc(x.tipo)}</span>${esc(x.texto)}${x.usuario ? ` <small style="color:var(--sub)">· ${esc(x.usuario)}</small>` : ''}</div></div>`).join('') || '<div class="vazio">Sem registros.</div>'}</div>`;
  }
  function detDemanda(d){
    const f = farol(d.prazo, demFeita(d), d.status), ch = d.chamado ? D.chamados.find(c => c.id === d.chamado) : null;
    const prox = { 'Pendente': ['Em execução', '▶ Iniciar'], 'Em execução': ['Concluída', '✓ Concluir'], 'Aguardando fornecedor': ['Em execução', '▶ Retomar'],
                   'Aguardando solicitante': ['Em execução', '▶ Retomar'], 'Concluída': ['Em execução', '↺ Reabrir'], 'Cancelada': ['Pendente', '↺ Reabrir'] }[d.status] || ['Em execução', '▶ Iniciar'];
    abrirFolha(`<span class="id">${esc(d.id)}</span>`, `
      <div class="det">
        <div class="c-meta" style="margin:0 0 6px"><span class="tag t-${clCls(d.classificacao)}">${esc(d.classificacao)}</span><span class="tag t-${stCls(d.status)}">${esc(d.status)}</span><span class="tag t-tipo">${esc(d.tipo)}</span>${!demFeita(d) ? `<span class="tag t-${f.cls}">${esc(f.txt)}</span>` : ''}</div>
        <div class="c-tit" style="font-size:16px">${esc(d.demanda)}</div>
        ${d.descricao ? `<p style="margin-top:8px;white-space:pre-wrap">${esc(d.descricao)}</p>` : ''}
        <div class="dupla"><div><b class="r">Origem</b>${esc(d.origem) || '—'}</div><div><b class="r">Solicitante</b>${esc(d.solicitante) || '—'}${d.area ? ' · ' + esc(d.area) : ''}</div></div>
        <div class="dupla"><div><b class="r">Projeto</b>${esc(d.projeto) || '—'}</div><div><b class="r">Entrega</b>${esc(d.entrega) || '—'}</div></div>
        <div class="dupla"><div><b class="r">Aberta</b>${brA(d.abertura) || '—'}</div><div><b class="r">Prazo</b>${brA(d.prazo) || '—'}</div></div>
        <div class="dupla"><div><b class="r">Iniciada</b>${brA(d.iniciada) || '—'}</div><div><b class="r">Concluída</b>${brA(d.concluida) || '—'}</div></div>
        ${d.chamado ? `<b class="r">Chamado</b><span class="id">${esc(d.chamado)}</span>${ch ? ' · ' + esc(ch.status) : ''}` : ''}
        ${d.protocolo ? `<b class="r">Solicitação</b><span class="id">${esc(d.protocolo)}</span>` : ''}
        ${d.obs ? `<b class="r">Observação</b><p style="white-space:pre-wrap">${esc(d.obs)}</p>` : ''}
        ${d.solucao ? `<div class="ret"><b>Solução</b>${esc(d.solucao)}</div>` : ''}
      </div>
      ${edita() ? `<div class="acoes"><button class="btn" id="ddProx">${prox[1]}</button>${ch ? '<button class="btn navy" id="ddCha">Ver chamado</button>' : '<button class="btn navy" id="ddNovoCha">Abrir chamado</button>'}</div>
      <div class="campo"><label class="l">Mudar status</label><div style="display:flex;gap:8px"><select id="ddSt">${opts(D.listas.statusDem, d.status)}</select><button class="btn sec" id="ddStOk">Aplicar</button></div></div>` : (ch ? '<div class="acoes"><button class="btn navy" id="ddCha">Ver chamado</button></div>' : '')}
      ${historicoDe(d.id)}`,
      edita() ? '<button class="btn sec" data-acao="fechar">Fechar</button><button class="btn" id="ddEdit">Editar</button>' : '');
    const mudar = (s, b) => s === 'Concluída' ? abrirConcluir(d) : chamar('mudarStatusDemanda', [d.id, s], () => { fecharFolha(); carregar('Status: ' + s); }, b);
    if ($('ddProx')) $('ddProx').onclick = e => mudar(prox[0], e.currentTarget);
    if ($('ddStOk')) $('ddStOk').onclick = e => $('ddSt').value === d.status ? toast('O status já é esse.') : mudar($('ddSt').value, e.currentTarget);
    if ($('ddEdit')) $('ddEdit').onclick = () => formDemanda(d);
    if ($('ddCha')) $('ddCha').onclick = () => detChamado(ch);
    if ($('ddNovoCha')) $('ddNovoCha').onclick = () => formChamado(null, d);
  }
  function formDemanda(d){
    const novo = !d, L = D.listas;
    d = d || { tipo: 'Demanda', classificacao: 'Backlog', status: 'Pendente', origem: 'Eu (BI)' };
    abrirFolha(novo ? 'Nova demanda / ideia' : 'Editar <span class="id">' + esc(d.id) + '</span>', `
      <div class="dupla"><div class="campo"><label class="l">Tipo</label><select id="fdTipo">${opts(L.tiposDem, d.tipo)}</select></div>
        <div class="campo"><label class="l">Classificação</label><select id="fdClass">${opts(L.classif, d.classificacao)}</select></div></div>
      <div class="campo"><label class="l">Demanda</label><input id="fdDem" value="${esc(d.demanda || '')}" placeholder="O que precisa ser feito, em uma linha"></div>
      <div class="campo"><label class="l">Descrição / detalhes</label><textarea id="fdDesc">${esc(d.descricao || '')}</textarea></div>
      <div class="dupla"><div class="campo"><label class="l">Origem</label><input id="fdOrig" list="dlOrig" value="${esc(d.origem || '')}" placeholder="Eu, supervisor, comercial…"></div>
        <div class="campo"><label class="l">Solicitante</label><input id="fdSol" value="${esc(d.solicitante || '')}"></div></div>
      <div class="dupla"><div class="campo"><label class="l">Área</label><input id="fdArea" list="dlArea" value="${esc(d.area || '')}"></div>
        <div class="campo"><label class="l">Projeto</label><input id="fdProj" list="dlProj" value="${esc(d.projeto || '')}"></div></div>
      <div class="dupla"><div class="campo"><label class="l">Tipo de entrega</label><select id="fdEnt">${opts(L.entregas, d.entrega, '')}</select></div>
        <div class="campo"><label class="l">Prazo</label><input id="fdPrazo" type="date" value="${esc(d.prazo || '')}"></div></div>
      <div class="dupla"><div class="campo"><label class="l">Status</label><select id="fdSt">${opts(L.statusDem, d.status)}</select></div>
        <div class="campo"><label class="l">Chamado ligado</label><select id="fdCha"><option value="">Nenhum</option>${D.chamados.map(c => `<option value="${esc(c.id)}" ${c.id === d.chamado ? 'selected' : ''}>${esc(c.id)} · ${esc(c.assunto.slice(0, 36))}</option>`).join('')}</select></div></div>
      <div class="campo"><label class="l">Observação</label><textarea id="fdObs">${esc(d.obs || '')}</textarea></div>
      <div class="campo"><label class="l">Solução (ao concluir)</label><textarea id="fdSolu" rows="2" placeholder="O que foi feito. Vai para o informe semanal.">${esc(d.solucao || '')}</textarea></div>
      <datalist id="dlOrig">${L.origens.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <datalist id="dlArea">${L.areas.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <datalist id="dlProj">${L.projetos.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`,
      `<button class="btn sec" data-acao="fechar">Cancelar</button><button class="btn" id="fdOk">${novo ? 'Cadastrar' : 'Salvar'}</button>`);
    $('fdOk').onclick = e => chamar('salvarDemanda', [{ id: d.id || '', abertura: d.abertura, tipo: $('fdTipo').value, classificacao: $('fdClass').value,
      demanda: $('fdDem').value.trim(), descricao: $('fdDesc').value.trim(), origem: $('fdOrig').value.trim(), solicitante: $('fdSol').value.trim(),
      area: $('fdArea').value.trim(), projeto: $('fdProj').value.trim(), entrega: $('fdEnt').value, prazo: $('fdPrazo').value, status: $('fdSt').value,
      chamado: $('fdCha').value, obs: $('fdObs').value.trim(), solucao: $('fdSolu').value.trim(), protocolo: d.protocolo }], id => { fecharFolha(); carregar(novo ? 'Demanda ' + id + ' cadastrada.' : 'Demanda atualizada.'); }, e.currentTarget);
  }

  /* ---------- Chamados ---------- */
  const nomeForn = s => { const f = (D.listas.fornecedores || []).find(x => x.sigla === s); return f ? f.nome : s; };
  function renderChamados(){
    const h = D.hoje;
    let l = D.chamados.slice();
    if (F.cStatus === 'abertos') l = l.filter(c => !chaFeito(c));
    if (F.cStatus === 'atrasados') l = l.filter(c => !chaFeito(c) && c.prazo && c.prazo < h);
    if (F.cStatus === 'concluidos') l = l.filter(chaFeito);
    if (F.cForn) l = l.filter(c => c.fornecedor === F.cForn);
    l.sort((a, b) => (chaFeito(a) - chaFeito(b)) || (a.prazo || '9999').localeCompare(b.prazo || '9999'));
    const porF = {}; D.chamados.filter(c => !chaFeito(c)).forEach(c => porF[c.fornecedor] = (porF[c.fornecedor] || 0) + 1);
    $('v-chamados').innerHTML = `
      <div class="kpis">${Object.keys(porF).sort().map(f => `<div class="kpi k-navy" data-forn="${esc(f)}"><span>${esc(nomeForn(f))}</span><b>${porF[f]}</b><small>${D.chamados.filter(c => !chaFeito(c) && c.fornecedor === f && c.prazo && c.prazo < h).length} atrasado(s)</small></div>`).join('') || '<div class="vazio">Nenhum chamado em aberto.</div>'}</div>
      <div class="filtros" data-f="cStatus">${[['abertos', 'Abertos'], ['atrasados', 'Atrasados'], ['concluidos', 'Concluídos'], ['todos', 'Todos']].map(([v, t]) => `<button class="chip ${F.cStatus === v ? 'on' : ''}" data-v="${v}">${t}</button>`).join('')}</div>
      <div class="linha-f"><select data-f="cForn">${'<option value="">Todos os fornecedores</option>' + D.listas.fornecedores.map(f => `<option value="${esc(f.sigla)}" ${F.cForn === f.sigla ? 'selected' : ''}>${esc(f.sigla)} · ${esc(f.nome)}</option>`).join('')}</select>
        ${edita() ? '<button class="btn sec" data-acao="cobranca" style="flex:0 0 auto">Gerar cobrança</button>' : ''}</div>
      ${l.map(c => { const f = farol(c.prazo, chaFeito(c), c.status), dias = c.data ? diff(c.concluido || h, c.data) : null;
        const u = D.historico.filter(x => x.ref === c.id).sort((a, b) => b.quando.localeCompare(a.quando))[0];
        return `<div class="card f-${f.cls}" data-cha="${esc(c.id)}"><div class="c-meta" style="margin-top:0"><span class="id">${esc(c.id)}</span><span class="tag t-forn">${esc(c.fornecedor)}</span><span class="tag t-${f.cls}">${esc(f.txt)}</span></div>
          <div class="c-tit">${esc(c.assunto)}</div>
          <div class="c-meta"><span>${esc(c.status)}</span>${dias != null ? `<span>${chaFeito(c) ? 'Resolvido em' : 'Aberto há'} ${dias}d</span>` : ''}${c.prazo ? `<span>Prazo ${br(c.prazo)}</span>` : ''}${c.responsavel ? `<span>${esc(c.responsavel)}</span>` : ''}${c.demanda ? `<span class="id">${esc(c.demanda)}</span>` : ''}</div>
          ${u ? `<div class="c-meta" style="font-style:italic">Último: ${br(u.data)} · ${esc(u.texto.slice(0, 90))}</div>` : ''}</div>`; }).join('') || '<div class="vazio">Nenhum chamado neste filtro.</div>'}`;
  }
  const msgChamado = c => `${c.id} ${c.assunto}\n\n${c.descricao || ''}${c.prazo ? '\n\nPrazo esperado: ' + brA(c.prazo) : ''}\n\n${D.usuario.nome} · ${D.area} Catupiry`.replace(/\n{3,}/g, '\n\n');
  function detChamado(c){
    const f = farol(c.prazo, chaFeito(c), c.status);
    abrirFolha(`<span class="id">${esc(c.id)}</span>`, `
      <div class="det"><div class="c-meta" style="margin:0 0 6px"><span class="tag t-forn">${esc(c.fornecedor)} · ${esc(nomeForn(c.fornecedor))}</span><span class="tag t-${f.cls}">${esc(f.txt)}</span></div>
        <div class="c-tit" style="font-size:16px">${esc(c.assunto)}</div>
        ${c.descricao ? `<p style="margin-top:8px;white-space:pre-wrap">${esc(c.descricao)}</p>` : ''}
        <div class="dupla"><div><b class="r">Solicitado</b>${brA(c.data) || '—'}</div><div><b class="r">Prazo</b>${brA(c.prazo) || '—'}</div></div>
        <div class="dupla"><div><b class="r">Status</b>${esc(c.status)}</div><div><b class="r">Responsável</b>${esc(c.responsavel) || '—'}</div></div>
        ${c.demanda ? `<b class="r">Demanda do BI</b><span class="id">${esc(c.demanda)}</span>` : ''}
        ${c.comentarios ? `<b class="r">Comentários</b><p style="white-space:pre-wrap">${esc(c.comentarios)}</p>` : ''}</div>
      ${edita() ? `<div class="campo"><label class="l">Mudar status</label><div style="display:flex;gap:8px"><select id="dcSt">${opts(D.listas.statusCha, c.status)}</select><button class="btn sec" id="dcStOk">Aplicar</button></div></div>` : ''}
      ${historicoDe(c.id)}`,
      edita() ? '<button class="btn sec" id="dcCopiar">Copiar mensagem</button><button class="btn" id="dcEdit">Editar</button>' : '');
    if ($('dcStOk')) $('dcStOk').onclick = e => $('dcSt').value === c.status ? toast('O status já é esse.') : chamar('salvarChamado', [Object.assign({}, c, { status: $('dcSt').value, concluido: '' })], () => { fecharFolha(); carregar('Status atualizado.'); }, e.currentTarget);
    if ($('dcCopiar')) $('dcCopiar').onclick = () => copiar(msgChamado(c), 'Mensagem copiada.');
    if ($('dcEdit')) $('dcEdit').onclick = () => formChamado(c);
  }
  function formChamado(c, dem){
    const novo = !c, L = D.listas;
    c = c || { status: 'Aberto', data: D.hoje, fornecedor: F.cForn || '', demanda: dem ? dem.id : '', assunto: dem ? dem.demanda : '', descricao: dem ? dem.descricao : '' };

  const mascaraCnpj = v => { v = v.replace(/\D/g, '').slice(0, 14); return v.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2'); };
  function cnpjOk(c){ c = c.replace(/\D/g, ''); if (!/^\d{14}$/.test(c) || /^(\d)\1+$/.test(c)) return false;
    const calc = n => { let s = 0, p = n - 7; for (let i = 0; i < n; i++) { s += Number(c[i]) * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
    return calc(12) === Number(c[12]) && calc(13) === Number(c[13]); }
  function formSolicitacao(nome){

  /* ---------- Informe semanal para a área (tom corporativo) ---------- */
  function textoInforme(ini, fim){
    const dentro = x => x && x >= ini && x <= fim;
    const dem = D.demandas, porId = id => dem.find(d => d.id === id);
    const sols = D.solicitacoes.filter(s => dentro(s.data) || (s.status === 'Concluída' && (porId(s.demanda) || {}).concluida && dentro(porId(s.demanda).concluida)));
    const recebidas = D.solicitacoes.filter(s => dentro(s.data));
    const concl = dem.filter(d => d.status === 'Concluída' && dentro(d.concluida));
    const corr = dem.filter(d => d.tipo === 'Correção de base' && ((d.status === 'Concluída' && dentro(d.concluida)) || d.status === 'Em execução'));
    const entregas = concl.filter(d => ['Solicitação', 'Correção de base', 'Ideia'].indexOf(d.tipo) < 0);
    const andamento = dem.filter(d => d.status === 'Em execução' && d.tipo !== 'Ideia' && d.tipo !== 'Correção de base' && d.tipo !== 'Solicitação');
    const aguard = dem.filter(d => /Aguardando/.test(d.status) && d.tipo !== 'Solicitação');
    const envios = (D.relatorios || []).filter(r => dentro(r.data)).slice().reverse();

    const sit = d => {

      if (d.status === 'Aguardando fornecedor') { const c = D.chamados.find(x => x.id === d.chamado); return `Aguardando retorno do fornecedor${c ? ' ' + nomeForn(c.fornecedor) : ''}${d.chamado ? ' (chamado ' + d.chamado + ')' : ''}.`; }
      if (d.status === 'Aguardando solicitante') return 'Aguardando retorno do solicitante.';

    };
    const P = [];

    if (sols.length) {

      const tipos = Object.keys(porF).map(k => `${porF[k]} de ${minusc(k)}`);

      P.push('Solicitações e cadastros\n' + intro + '\n' + sols.map(s => {

        return `- ${s.formulario}: ${tituloSolic(s)} (pedido de ${s.solicitante} em ${br(s.data)}). ${sit(d)}`;

    if (envios.length) {

  function abrirInforme(qual){

  /* ---------- Concluir demanda (solução) + mensagem de retorno ---------- */
  const VAR_BASE = ['Solicitante', 'Solicitante completo', 'Protocolo', 'Meu nome', 'Data', 'Solução'];
  function varsSolic(s){
    const f = D.formularios.find(x => x.nome === s.formulario), v = {
      'Solicitante': String(s.solicitante || '').split(' ')[0], 'Solicitante completo': s.solicitante, 'Protocolo': s.protocolo,
      'Meu nome': D.usuario.nome, 'Data': brA(D.hoje) };
    Object.keys(s.dados || {}).forEach(k => {
      let x = s.dados[k]; const c = f && f.campos.find(y => y.campo === k);
      if (c && c.tipo === 'cnpj') x = mascaraCnpj(x);
      if (c && c.tipo === 'data' && /^\d{4}-/.test(x)) x = brA(x).slice(0, 6) + x.slice(0, 4);
      if (c && c.tipo === 'cep') x = String(x).replace(/^(\d{5})(\d{3})$/, '$1-$2');
      v[k] = x;
    });
    return v;
  }
  const preencher = (tpl, v) => String(tpl || '').replace(/\{([^{}]+)\}/g, (m, k) => { const x = v[k.trim()]; return x == null || x === '' ? '[' + k.trim() + ']' : x; });

  /** soMensagem = true: só gera a mensagem (sem concluir). */
  function abrirConcluir(d, soMensagem, sForcada){
    const s = sForcada || (d.protocolo ? D.solicitacoes.find(x => x.protocolo === d.protocolo) : null);

    let solEditada = false, msgEditada = false, avisou = false;
    abrirFolha(soMensagem ? 'Mensagem de retorno' : 'Concluir demanda', `
      <div class="det"><div class="c-meta" style="margin:0">${d.id ? `<span class="id">${esc(d.id)}</span>` : ''}${s ? `<span class="tag t-tipo">${esc(s.formulario)}</span><span class="id">${esc(s.protocolo)}</span>` : ''}</div>

      ${!soMensagem ? `<div class="campo"><label class="l">Solução / o que foi feito</label><textarea id="crSol" rows="3" placeholder="Ex.: loja cadastrada no sistema com o código 12345.">${esc(d.solucao || '')}</textarea>

      (soMensagem ? '' : '<button class="btn" id="crOk">✓ Concluir</button>'));
    const val = () => campos.map((c, i) => ({ nome: c.nome, v: $('cr' + i).value.trim() }));
    const atualizar = () => {
      if ($('crSol') && !solEditada && campos.length) $('crSol').value = val().filter(x => x.v && !/senha/i.test(x.nome)).map(x => x.nome + ': ' + x.v).join(' · ');
      if (m && !msgEditada) {
        const v = varsSolic(s); val().forEach(x => v[x.nome] = x.v); v['Solução'] = $('crSol') ? $('crSol').value.trim() : (d.solucao || '');
        $('crMsg').value = preencher(m.mensagem, v);
      }
    };
    campos.forEach((c, i) => $('cr' + i).oninput = atualizar);
    if ($('crSol')) $('crSol').oninput = () => { solEditada = true; atualizar(); };
    if ($('crMsg')) $('crMsg').oninput = () => { msgEditada = true; };
    if (!d.solucao || !$('crSol')) atualizar(); else if (m) { solEditada = true; atualizar(); }
    const msg = () => $('crMsg') ? $('crMsg').value : '';
    if ($('crCop')) $('crCop').onclick = () => copiar(msg(), 'Mensagem copiada.');
    if ($('crZap')) $('crZap').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(msg()), '_blank');

      if (!sol && !avisou) { avisou = true; return toast('Sem a solução, o informe fica sem detalhe. Toque de novo para concluir assim.'); }
      const texto = msg();
      chamar('concluirDemanda', [d.id, sol], () => { fecharFolha(); if (texto) copiar(texto, ''); carregar(texto ? 'Concluída. Mensagem de retorno copiada.' : 'Demanda concluída.'); }, e.currentTarget);
    };

    const kp = (cls, t, val, sub, p) => `<div class="kpi ${cls}" style="cursor:default"><span>${t}</span><b>${val}</b><small>${sub}</small>${p != null ? `<i class="kbar"><u style="width:${p}%"></u></i>` : ''}</div>`;

        ${kp('k-navy', 'Diretos', Di.votaram + '/' + Di.total, 'equipe própria · ' + pct(Di.votaram, Di.total) + '%', pct(Di.votaram, Di.total))}
        ${kp(v.aberta ? 'k-teal' : 'k-cinza', 'Status', v.aberta ? 'Aberta' : 'Encerrada', v.ultimoVoto ? 'último voto ' + br(v.ultimoVoto) + ' ' + v.ultimoVoto.slice(11, 16) : 'nenhum voto ainda')}

      ${v.repetidos ? `<div class="aviso">${pl(v.repetidos, 'voto repetido foi desconsiderado', 'votos repetidos foram desconsiderados')} (mesma pessoa votando de novo na mesma categoria). Vale só o primeiro voto de cada pessoa.</div>` : ''}
      <div class="filtros" data-f="vSeg">${[['', 'Geral'], ['SPOT PROMO', 'Spot Promo'], ['DIRETO', 'Diretos']].map(([k, t]) => `<button class="chip ${seg === k ? 'on' : ''}" data-v="${k}">${t}</button>`).join('')}</div>`;
    v.categorias.forEach(c => {
      const val = o => seg === 'SPOT PROMO' ? o.spot : seg === 'DIRETO' ? o.direto : o.total;
      const tot = seg === 'SPOT PROMO' ? c.spot : seg === 'DIRETO' ? c.direto : c.total;
      const rk = c.opcoes.slice().sort((a, b) => val(b) - val(a) || a.nome.localeCompare(b.nome, 'pt-BR'));
      const mx = Math.max(1, ...rk.map(val)), lider = rk.length && val(rk[0]) ? val(rk[0]) : -1;
      const empate = rk.filter(o => val(o) === lider).length > 1;
      const dif = rk.length > 1 && lider > 0 && !empate ? val(rk[0]) - val(rk[1]) : 0;
      html += `<div class="secao">${esc(c.titulo)} · ${pl(tot, 'voto', 'votos')}</div>
        <div class="bloco">${rk.length ? rk.map((o, i) => { const n = val(o), top = n === lider;
          return `<div class="vt ${top ? 'top' : ''}"><div class="vt-cab"><span class="vt-pos">${top ? '★' : (i + 1) + 'º'}</span><b>${esc(o.nome)}</b><span class="vt-n">${n}<small> · ${pct(n, tot)}%</small></span></div>
            <i class="vt-barra"><u style="width:${Math.round(n / mx * 100)}%"></u></i>
            ${seg ? '' : `<div class="vt-seg"><span>Spot Promo <b>${o.spot}</b></span><span>Diretos <b>${o.direto}</b></span></div>`}</div>`; }).join('') : '<div class="vazio">Nenhuma opção cadastrada.</div>'}
          ${tot ? `<div class="ajuda" style="padding:4px 0 10px">${empate ? 'Empate na liderança.' : dif ? `Vantagem de ${pl(dif, 'voto', 'votos')} para o 1º lugar.` : ''}</div>` : ''}</div>`;
    });

      <div class="ajuda" style="margin-top:10px">Atualizado ${br(v.atualizado)} às ${v.atualizado.slice(11, 16)}. Toque em ↻ no topo para atualizar a parcial.</div>`;
    $('v-votacao').innerHTML = html;
  }

        ${kp('k-cinza', 'Aguardam BKO', T.pendBko, 'double check')}
        ${kp('k-verm', 'Reprovadas', T.repSup + T.repBko, T.repSup + ' supervisor · ' + T.repBko + ' BKO')}
        ${kp('k-cinza', 'Duplicadas', T.duplicadas, 'mesma loja, semana e tipo')}
      </div>
      <div class="ajuda" style="margin-top:10px">Regra: vale 1 ponto extra de cada tipo por promotor, loja e semana. Gôndola ${T.pontosTipo.GONDOLA} · geladeira ${T.pontosTipo.GELADEIRA} · ilha ${T.pontosTipo.ILHA} pontos. Só soma depois do supervisor e do BKO.</div>
      <div class="secao">Ranking dos promotores</div>
      <div class="filtros" data-f="tgSup">${[''].concat(sups).map(s => `<button class="chip ${F.tgSup === s ? 'on' : ''}" data-v="${esc(s)}">${s ? esc(s) : 'Todos'}</button>`).join('')}</div>
      <div class="bloco" style="margin-top:10px">${top.map((r, k) => `<div class="vt ${k === 0 && r.pontos ? 'top' : ''}"><div class="vt-cab"><span class="vt-pos">${k === 0 && r.pontos ? '★' : (k + 1) + 'º'}</span>
          <b>${esc(r.colab)} <small style="color:var(--sub);font-weight:500">· ${esc(r.uf)} · ${esc(r.supervisor || 'sem supervisor')}</small></b><span class="vt-n">${r.pontos.toLocaleString('pt-BR')}<small> pts</small></span></div>
          <i class="vt-barra"><u style="width:${Math.round(r.pontos / mx * 100)}%"></u></i>
          <div class="vt-seg"><span>Gôndola <b>${r.tipos.GONDOLA || 0}</b></span><span>Geladeira <b>${r.tipos.GELADEIRA || 0}</b></span><span>Ilha <b>${r.tipos.ILHA || 0}</b></span>
            ${r.pendentes ? `<span style="color:var(--amarelo)">+${r.potencial} pts em validação</span>` : ''}${r.duplicadas ? `<span>${r.duplicadas} dup.</span>` : ''}</div></div>`).join('') || '<div class="vazio">Sem envios.</div>'}
        ${rk.length > 15 ? `<button class="btn sec mini" data-acao="tgTodos" style="margin:10px 0">${F.tgTodos ? 'Mostrar só os 15 primeiros' : 'Ver todos os ' + rk.length}</button>` : ''}</div>
      <div class="secao">Supervisor x BKO</div>
      <div class="ajuda">Divergência = fotos que o supervisor aprovou e o BKO reprovou. Quanto maior, mais o supervisor está aprovando fora do critério.</div>
      <div class="bloco" style="margin-top:10px;overflow-x:auto"><table class="tabela-tg"><tr><th>Supervisor</th><th>BKO</th><th>Envios</th><th>Pendentes</th><th>Aprovou</th><th>Reprovou</th><th>BKO conferiu</th><th>Divergência</th></tr>
        ${T.supervisores.map(s => { const dv = pct(s.reprovBko, s.conferidas), cor = !s.conferidas ? 'var(--sub)' : dv >= 20 ? 'var(--vermelho)' : dv >= 10 ? 'var(--amarelo)' : 'var(--verde)';
          return `<tr><td><b>${esc(s.supervisor)}</b></td><td>${esc(s.bko || '—')}</td><td>${s.envios}</td><td>${s.pendSup}</td><td>${s.aprovSup}</td><td>${s.reprovSup}</td><td>${s.conferidas}</td>
            <td style="color:${cor};font-weight:700">${s.conferidas ? dv + '% <small style="color:var(--sub);font-weight:400">(' + s.reprovBko + ')</small>' : '—'}</td></tr>`; }).join('')}</table></div>
      <div class="grade">
        <div><div class="secao">Pontos por semana</div><div class="bloco barras">${T.semanas.map(w => `<div class="b"><div><span>Semana ${br(w.semana)} a ${br(addD(w.semana, 6))}</span><b>${w.pontos.toLocaleString('pt-BR')}</b></div><i><u style="width:${Math.round(w.pontos / Math.max(1, ...T.semanas.map(x => x.pontos)) * 100)}%;background:var(--amarelo);color:var(--amarelo)"></u></i></div>`).join('') || '<div class="vazio">—</div>'}</div></div>
        <div><div class="secao">Aprovados por tipo</div><div class="bloco barras">${['GONDOLA', 'GELADEIRA', 'ILHA'].map(t => { const x = T.tipos.find(y => y.tipo === t) || { qtd: 0, pontos: 0 };
          return `<div class="b"><div><span>${TIPO_TG[t]}</span><b>${x.qtd} · ${x.pontos.toLocaleString('pt-BR')} pts</b></div><i><u style="width:${pct(x.qtd, Math.max(1, T.aprovadas))}%;background:var(--teal);color:var(--teal)"></u></i></div>`; }).join('')}</div></div>
      </div>
      <div class="ajuda" style="margin-top:10px">Atualizado ${br(T.atualizado)} às ${T.atualizado.slice(11, 16)} · os dados da campanha são lidos a cada 5 minutos.</div>`;
    $('v-trigold').innerHTML = html;
  }

  /* ---------- Folha ---------- */
  function abrirFolha(t, corpo, rod){ $('fTitulo').innerHTML = t; $('fCorpo').innerHTML = corpo; $('fRod').innerHTML = rod || ''; $('fCorpo').scrollTop = 0; $('fundo').classList.add('on'); $('folha').classList.add('on'); }
  function fecharFolha(){ $('fundo').classList.remove('on'); $('folha').classList.remove('on'); }
  function menuNovo(){
    abrirFolha('Novo', `<div class="acoes" style="grid-template-columns:1fr">
      <button class="btn" data-novo="demanda">📌 Demanda / ideia / melhoria</button>
      <button class="btn navy" data-novo="chamado">📨 Chamado para fornecedor</button>
      <button class="btn" style="background:var(--marrom)" data-novo="rotina">🔁 Rotina / report recorrente</button>
      <button class="btn" style="background:var(--teal)" data-novo="projeto">🎯 Projeto</button>
      <button class="btn verde" data-novo="relatorio">⬆ Envio de relatório (com arquivo)</button></div>`);
  }

  /* ---------- Eventos ---------- */
  $('lgEntrar').onclick = entrar;
  $('lgSenha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  $('lgEmail').addEventListener('keydown', e => { if (e.key === 'Enter') $('lgSenha').focus(); });
  $('btSair').onclick = sair; $('carSair').onclick = sair;
  $('btAtualizar').onclick = () => carregar('Atualizado.');
  $('carTentar').onclick = () => carregar();
  $('abas').onclick = e => { const b = e.target.closest('.aba[data-aba]'); if (b) irAba(b.dataset.aba); };
  $('btMenu').onclick = abrirMenu; $('menuFechar').onclick = fecharMenu; $('menuFundo').onclick = fecharMenu;
  ajustarLayout(); window.addEventListener('resize', ajustarLayout);
  $('fundo').onclick = fecharFolha; $('fFechar').onclick = fecharFolha;
  $('fab').onclick = () => ({ demandas: () => formDemanda(), chamados: () => formChamado(), rotinas: () => formRotina(), projetos: () => formProjeto(), relatorios: () => formEntrega(null) }[aba] || menuNovo)();

  document.body.addEventListener('click', e => {
    const t = e.target;
    const novo = t.closest('[data-novo]'); if (novo) { ({ demanda: formDemanda, chamado: () => formChamado(), rotina: () => formRotina(), projeto: () => formProjeto(), relatorio: () => formEntrega(null) })[novo.dataset.novo](); return; }
    if (t.closest('[data-acao="fechar"]')) return fecharFolha();
    const ac = t.closest('[data-acao]');
    if (ac) {
      const a = ac.dataset.acao;
      if (a === 'resumo') return abrirTexto('Resumo para o gestor', textoResumo(), D.area + ' · Resumo da semana');
      if (a === 'informe') return abrirInforme('atual');
      if (a === 'acionar') { fecharMenu(); return formAcionar(); }
      if (a === 'tgTodos') { F.tgTodos = !F.tgTodos; return renderTrigold(); }
      if (a === 'novoRel') return formEntrega(null);
      if (a === 'cobrarVoto') return copiar(lembreteVoto(), 'Lembrete copiado.');
      if (['novoUsuario', 'addLink', 'rmLink', 'salvarLinks', 'salvarListas', 'salvarConfig'].indexOf(a) >= 0) return acaoConfig(a, ac);
      if (a === 'cobranca') { if (!F.cForn) return toast('Escolha um fornecedor no filtro.'); return abrirTexto('Cobrança · ' + nomeForn(F.cForn), textoCobranca(F.cForn), 'Status dos chamados Catupiry'); }
      if (a === 'cobrarAgenda') { const A = D.agenda, p = A.pessoas.filter(x => !x.enviou), venc = D.hoje > A.prazo;
        return copiar(`Pessoal, ${venc ? 'o prazo da agenda semanal venceu' : 'a agenda da semana que vem precisa ser enviada até ' + SEM[dow(A.prazo)].toLowerCase() + ' (' + br(A.prazo) + ')'}${venc ? ' e ainda faltam' : '. Ainda faltam'}:\n\n` + p.map(x => '- ' + x.nome + (x.papel ? ' (' + x.papel + ')' : '')).join('\n') + '\n\nObrigado!', 'Lembrete copiado.'); }
      if (a === 'feito') { const v = $('feito').value.trim(); if (!v) return toast('Escreva o que você fez.'); return chamar('registrar', ['', v, 'Feito'], () => carregar('Registrado!'), ac); }
      if (a === 'andamento') { const v = $('andTxt').value.trim(); if (!v) return toast('Escreva o andamento.'); return chamar('registrar', [ac.dataset.ref, v, 'Andamento'], () => { fecharFolha(); carregar('Andamento registrado.'); }, ac); }
    }
    const inf = t.closest('[data-informe]'); if (inf) return abrirInforme(inf.dataset.informe);
    const usr = t.closest('[data-usr]'); if (usr) return formUsuario(D.config.usuarios.find(x => x.email === usr.dataset.usr));
    const mo = t.closest('[data-modelo]'); if (mo) return formModelo(mo.dataset.modelo);
    const agi = t.closest('[data-ag]'); if (agi) return detAgenda(D.agenda.pessoas[Number(agi.dataset.ag)]);
    const kp = t.closest('[data-ir]'); if (kp) return irAba(kp.dataset.ir);
    const it = t.closest('.item[data-i]'); if (it && ITENS[it.dataset.i]) return ITENS[it.dataset.i].abrir();
    const ent = t.closest('[data-entregar]'); if (ent) { e.stopPropagation(); return formEntrega(D.rotinas.find(r => r.id === ent.dataset.entregar)); }
    const dm = t.closest('[data-dem]'); if (dm) return detDemanda(D.demandas.find(x => x.id === dm.dataset.dem));
    const ch = t.closest('[data-cha]'); if (ch) return detChamado(D.chamados.find(x => x.id === ch.dataset.cha));
    const ro = t.closest('[data-rot]'); if (ro) return detRotina(D.rotinas.find(x => x.id === ro.dataset.rot));
    const pj = t.closest('[data-proj]'); if (pj) return detProjeto(D.projetos.find(x => x.id === pj.dataset.proj));
    const fm = t.closest('[data-form]'); if (fm) return formSolicitacao(fm.dataset.form);
    const so = t.closest('[data-sol]'); if (so) return detSolicitacao(D.solicitacoes.find(x => x.protocolo === so.dataset.sol));
    const fo = t.closest('[data-forn]'); if (fo) { F.cForn = fo.dataset.forn; return renderChamados(); }
    const rf = t.closest('[data-rf]'); if (rf) { F.rFiltro = rf.dataset.rf; return renderRotinas(); }
    const chip = t.closest('.filtros .chip');
    if (chip) { const k = chip.parentElement.dataset.f; F[k] = chip.dataset.v; return ({ dClass: renderDemandas, cStatus: renderChamados, rFiltro: renderRotinas, vSeg: renderVotacao, agF: renderAgenda, tgSup: renderTrigold })[k](); }
  });
  let tB;
  document.body.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.f; if (k === 'dBusca') { F.dBusca = e.target.value; clearTimeout(tB); tB = setTimeout(() => { renderDemandas(); const el = document.querySelector('[data-f="dBusca"]'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); } });
  document.body.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.f; if (!k || k === 'dBusca') return; F[k] = e.target.value; ({ dStatus: renderDemandas, dTipo: renderDemandas, cForn: renderChamados, relRot: renderRelatorios, relMes: renderRelatorios, relPara: renderRelatorios })[k](); });
  $('introPular').onclick = () => { INTRO.acabou = true; fecharIntro(); };

  (function(){ const s = lsGet(K_LOGIN) || lsGet(K_SSO); if (s && s.email && s.senha) { CRED = s; $('lgEmail').value = s.email; carregar(); } else mostrar('login'); })();
</script>
</body>
</html>
