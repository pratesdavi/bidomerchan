<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bordo:#9a0019; --acc:#ff2d55; --acc2:#ff6b81;
    --bg:#07090d; --bege:#0f131a; --card:#10141c; --card2:#151a24;
    --texto:#e8ebf2; --sub:#8a93a6; --titulo:#6f7a90;
    --linha:rgba(255,255,255,.07); --borda:rgba(255,255,255,.09);
    --verde:#22d37a; --marrom:#f5a524; --vermelho:#ff3b5c; --creme:#ffd166;
    --navy:#3d8bff; --teal:#22d3ee; --amarelo:#facc15; --cinza:#6b7385; --roxo:#a78bfa;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,"Segoe UI",-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(900px 420px at 85% -120px,rgba(154,0,25,.35),transparent 70%),radial-gradient(700px 380px at -10% 10%,rgba(61,139,255,.08),transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
  .hidden{display:none!important}
  button,select,input,textarea{font-family:inherit}
  .wrap{max-width:1180px;margin:0 auto}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#262c38;border-radius:8px}

  /* ---------- Login / carregando ---------- */
  .tela{position:fixed;inset:0;z-index:90;background:inherit;background-color:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
  .faixa{padding:56px 24px 24px;text-align:center;position:relative}
  .faixa img{width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,45,85,.4),0 0 0 10px rgba(255,45,85,.06),0 0 60px rgba(255,45,85,.45);animation:pulsaGlow 3s ease-in-out infinite}
  .faixa h1{font-size:26px;font-weight:800;letter-spacing:-.3px;margin-top:20px}
  .faixa h1::after{content:"_";color:var(--acc);animation:pisca 1s steps(1) infinite}
  .faixa p{font-family:var(--mono);font-size:11px;color:var(--sub);margin-top:8px;letter-spacing:2.5px;text-transform:uppercase}
  .caixa{background:rgba(16,20,28,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--borda);border-radius:16px;padding:24px 22px;
    width:calc(100% - 32px);max-width:380px;margin:8px auto 24px;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden}
  .caixa::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
  .caixa h2{font-family:var(--mono);font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
  .caixa h2::before{content:"› ";color:var(--acc)}
  .lembrar{display:flex;align-items:center;gap:8px;margin:14px 0 16px;font-size:13px;color:var(--sub);cursor:pointer}
  .lembrar input{width:16px;height:16px;accent-color:var(--acc)}
  .msg-erro{color:var(--vermelho);font-size:13px;min-height:18px;margin-top:12px;text-align:center;line-height:1.4}
  .carregando{align-items:center;justify-content:center;gap:18px;font-family:var(--mono)}
  .carregando img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 60px rgba(255,45,85,.5);animation:pulsaGlow 1.4s ease-in-out infinite}
  .carregando #carTxt{color:var(--sub);font-size:12px!important;letter-spacing:2px!important}
  .scan{width:220px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;position:relative}
  .scan::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:varre 1.1s ease-in-out infinite}

  /* ---------- Campos e botões ---------- */
  label.l{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:10px;background:#0b0e14;font-size:14.5px;outline:none;color:var(--texto);transition:border-color .2s,box-shadow .2s}
  input::placeholder,textarea::placeholder{color:#4d5566}
  textarea{resize:vertical;min-height:70px;line-height:1.4}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,45,85,.15)}
  input:disabled{opacity:.5}
  .campo{margin-top:14px}
  .ajuda{font-size:11.5px;color:var(--sub);margin-top:5px}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{padding:12px 18px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:linear-gradient(135deg,#c8102e,var(--bordo));color:#fff;font-size:14px;font-weight:700;cursor:pointer;
    transition:transform .1s,box-shadow .2s,opacity .2s;white-space:nowrap;box-shadow:0 6px 20px rgba(200,16,46,.3),inset 0 1px 0 rgba(255,255,255,.15)}
  .btn:hover{box-shadow:0 8px 28px rgba(255,45,85,.45),inset 0 1px 0 rgba(255,255,255,.15)}
  .btn:active{transform:scale(.97)} .btn:disabled{opacity:.45}
  .btn.sec{background:rgba(255,255,255,.04);color:var(--texto);border:1px solid var(--borda);box-shadow:none}
  .btn.navy{background:linear-gradient(135deg,#3d8bff,#1d5fd1);box-shadow:0 6px 20px rgba(61,139,255,.25)}
  .btn.verde{background:linear-gradient(135deg,#22d37a,#109956);color:#04130b;box-shadow:0 6px 20px rgba(34,211,122,.25)}
  .btn.mini{padding:7px 12px;font-size:12px;border-radius:8px}
  .btn.full{width:100%}

  /* ---------- Cabeçalho e abas ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(7,9,13,.78);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--borda)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--acc) 30%,var(--teal) 70%,transparent);opacity:.6}
  .topo{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
  .topo img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,45,85,.35),0 0 24px rgba(255,45,85,.35)}
  .topo .t{flex:1;min-width:0}
  .titulo-app{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--sub)}
  .topo h1{font-size:18px;font-weight:800;line-height:1.25;letter-spacing:-.2px}
  .topo small{font-size:12px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sync{font-family:var(--mono);font-size:10.5px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:6px}
  .sync i{width:6px;height:6px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);animation:pisca 2s ease-in-out infinite}
  .ico{background:rgba(255,255,255,.05);border:1px solid var(--borda);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,border-color .2s}
  .ico:hover{background:rgba(255,45,85,.12);border-color:rgba(255,45,85,.4)}
  nav{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .aba{background:transparent;border:1px solid transparent;color:var(--sub);font-weight:600;font-size:13px;padding:7px 12px;cursor:pointer;border-radius:9px;white-space:nowrap;transition:all .2s}
  .aba:hover{color:var(--texto);background:rgba(255,255,255,.04)}
  .aba.on{color:#fff;background:rgba(255,45,85,.12);border-color:rgba(255,45,85,.45);box-shadow:0 0 18px rgba(255,45,85,.18)}
  .aba b{display:inline-block;min-width:18px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.08);font-family:var(--mono);font-size:10.5px;margin-left:5px;color:var(--texto)}
  .aba b.alerta{background:var(--acc);color:#fff;box-shadow:0 0 10px rgba(255,45,85,.6)}

  main{padding:0 16px 110px}
  .secao{display:flex;align-items:center;gap:10px;margin:26px 0 10px;color:var(--sub);font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;white-space:nowrap}
  .secao::before{content:"";width:6px;height:6px;background:var(--acc);border-radius:1px;box-shadow:0 0 8px var(--acc);flex-shrink:0}
  .secao::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--borda),transparent)}
  .secao .btn{margin-left:auto;order:3;font-family:Inter,sans-serif;letter-spacing:0;text-transform:none}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0 18px}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}
  .kpi{--c:var(--navy);position:relative;border-radius:14px;padding:13px 14px;overflow:hidden;cursor:pointer;min-height:104px;display:flex;flex-direction:column;

<script>

  const API_URL = window.API_URL || 'https://script.google.com/macros/s/AKfycbzA0JvbZGSoXrj9DAvk1yxMoW0htsvNPkYRRtQlyCAQTpz_ZZIWrMLaKCewTRYQBjs_/exec';
  const NO_GOOGLE = !!(window.google && google.script && google.script.run);
  if (!NO_GOOGLE) window.google = { script: { get run(){ return chamadaApi(); } } };
  function chamadaApi(){
    let ok = () => {}, falha = () => {};
    const h = new Proxy({}, { get(t, fn){
      if (fn === 'withSuccessHandler') return f => { ok = f; return h; };
      if (fn === 'withFailureHandler') return f => { falha = f; return h; };
      return (...args) => {
        if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(API_URL)) return setTimeout(() => falha(new Error('Falta colar o link /exec do Apps Script no config.js.')), 0);
        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
          .then(r => r.json())
          .then(j => j && j.ok ? ok(j.r) : falha(new Error(j && j.erro ? j.erro : 'Resposta inválida do servidor.')))
          .catch(e => falha(new Error('Não consegui falar com o servidor. Confira o link /exec e se a implantação está com acesso "Qualquer pessoa". (' + e.message + ')')));
      };
    } });
    return h;
  }

  const $ = id => document.getElementById(id);
  document.querySelectorAll('img[data-logo]').forEach(i => { i.src = $('logoBase').src; });
  const K_LOGIN = 'trigold.login', K_SSO = 'merchan.sso';
  let CRED = null, D = null, aba = 'validar', ETAPA = 'sup', FILA = [], POS = 0, FOTO = 0, ULTIMA = null;
  const F = { semana: '', colab: '', estado: 'todas', busca: '', eqFiltro: 'sem' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let tT; function toast(t, tipo, ms){ const e = $('toast'); e.innerHTML = t; e.className = 'toast on ' + (tipo || ''); clearTimeout(tT); tT = setTimeout(() => e.className = 'toast', ms || 3000); }
  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k){ try { localStorage.removeItem(k); } catch (e) {} }
  const toUTC = s => { const p = String(s).slice(0, 10).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };
  const addD = (s, n) => new Date(toUTC(s) + n * 86400000).toISOString().slice(0, 10);
  const dow = s => new Date(toUTC(s)).getUTCDay();
  const br = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
  const brA = s => s ? br(s) + '/' + s.slice(2, 4) : '';
  const SEM = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const TIPO = { GONDOLA: 'Ponta de gôndola', GELADEIRA: 'Porta de geladeira', ILHA: 'Ilha' };
  const EST = { pend_sup: ['Aguarda supervisor', 'pend'], pend_bko: ['Aguarda BKO', 'pendb'], aprovada: ['Aprovada', 'apr'], rep_sup: ['Reprovada (supervisor)', 'rep'],
                rep_bko: ['Reprovada (BKO)', 'rep'], duplicada: ['Duplicada', 'dup'] };
  const pl = (n, a, b) => n + ' ' + (n === 1 ? a : b);
  const perfil = () => D.usuario.perfil;
  const semanaTxt = s => `${br(s)} a ${br(addD(s, 6))}`;

  /* ---------- Login e carga ---------- */
  function mostrar(q){ ['login', 'carregando'].forEach(x => $(x).classList.toggle('hidden', x !== q)); ['cab', 'app'].forEach(x => $(x).classList.toggle('hidden', q !== 'app')); }
  function entrar(){
    const email = $('lgEmail').value.trim().toLowerCase(), senha = $('lgSenha').value.trim();
    if (!email || !senha) { $('lgErro').textContent = 'Preencha e-mail e senha.'; return; }
    CRED = { email, senha }; if ($('lgLembrar').checked) { lsSet(K_LOGIN, CRED); lsSet(K_SSO, CRED); } else lsDel(K_LOGIN);
    $('lgErro').textContent = ''; carregar();
  }
  function sair(){ lsDel(K_LOGIN); lsDel(K_SSO); CRED = null; D = null; $('lgSenha').value = ''; fecharFolha(); mostrar('login'); }
  let tCarga;
  function erroCarga(msg){
    clearTimeout(tCarga);
    if (/^LOGIN:/.test(msg)) { lsDel(K_LOGIN); if (/inválidos/.test(msg)) lsDel(K_SSO); D = null; mostrar('login'); $('lgErro').textContent = msg.replace(/^LOGIN: ?/, ''); return; }
    if (D) { toast(esc(msg), 'erro', 5000); return; }
    mostrar('carregando'); $('carTxt').classList.add('hidden'); $('carScan').classList.add('hidden'); $('carErro').classList.remove('hidden'); $('carMsg').innerHTML = msg;
  }
  function carregar(msg){
    clearTimeout(tCarga);
    if (!D) { mostrar('carregando'); $('carTxt').classList.remove('hidden'); $('carScan').classList.remove('hidden'); $('carErro').classList.add('hidden');
      tCarga = setTimeout(() => erroCarga('O servidor não respondeu em 40 segundos. Tente de novo.'), 40000); }
    google.script.run.withSuccessHandler(txt => {
      clearTimeout(tCarga);
      let r; try { r = JSON.parse(txt); } catch (e) { return erroCarga('Resposta inválida do servidor.'); }
      if (r.erro) return erroCarga(esc(r.erro));
      D = r; iniciar(); if (msg) toast(msg, 'ok');
    }).withFailureHandler(e => erroCarga(esc(e && e.message ? e.message : String(e)))).carregarJSON(CRED.email, CRED.senha);
  }
  function chamar(fn, args, ok, btn, falhou){
    const t = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Salvando'; }
    google.script.run.withSuccessHandler(r => { if (btn) { btn.disabled = false; btn.innerHTML = t; } ok(r); })
      .withFailureHandler(e => { if (btn) { btn.disabled = false; btn.innerHTML = t; } const m = e && e.message ? e.message : String(e); if (/^LOGIN:/.test(m)) return erroCarga(m); toast(esc(m), 'erro', 5000); if (falhou) falhou(m); })[fn](CRED.email, CRED.senha, ...args);
  }

  /* ---------- Montagem ---------- */
  function abasDo(){
    const p = perfil();
    if (p === 'ADMIN') return [['validar', 'Validar'], ['envios', 'Envios'], ['senhas', 'Senhas da semana'], ['equipe', 'Equipe'], ['importar', 'Importar'], ['acessos', 'Acessos e produtos']];
    if (p === 'GESTOR') return [['envios', 'Envios']];
    return [['validar', 'Validar'], ['envios', 'Histórico']];
  }
  function iniciar(){
    const per = { ADMIN: 'Administrador', SUPERVISOR: 'Supervisor', BKO: 'BKO · double check', GESTOR: 'Gestor' }[perfil()];
    $('quemTxt').textContent = D.usuario.nome + ' · ' + per + (perfil() === 'BKO' && D.usuario.supervisores.length ? ' · ' + D.usuario.supervisores.join(', ') : '');
    if (perfil() === 'BKO') ETAPA = 'bko'; else if (perfil() === 'SUPERVISOR') ETAPA = 'sup';
    if (!abasDo().some(a => a[0] === aba)) aba = abasDo()[0][0];

  function normalizar(rows){
    let ini = rows.findIndex(r => r.some(c => /data da visita/i.test(c)));
    if (ini < 0) throw new Error('Não achei a coluna "Data da visita". Confira se é a exportação da pesquisa TRI GOLD.');

    const um = f => low.findIndex(f), todos = f => low.map((h, i) => f(h) ? i : -1).filter(i => i >= 0);
    const I = { data: um(h => h.startsWith('data da visita')), pdv: um(h => h === 'pdv'), cod: um(h => h.includes('código pdv') || h.includes('codigo pdv')), rede: um(h => h === 'rede'),
      canal: um(h => h === 'canal'), uf: um(h => h === 'uf'), colab: um(h => h === 'colaborador'), montou: um(h => h.includes('montou')),
      tipo: um(h => h.includes('tipo de exposi')), foto: um(h => h.includes('foto')) };
    const cats = todos(h => h.includes('categoria do ponto')), prods = todos(h => h.includes('produtos foco'));
    ['data', 'colab', 'tipo', 'foto'].forEach(k => { if (I[k] < 0) throw new Error('Coluna não encontrada: ' + k); });
    const v = (r, i) => i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : '';
    return rows.slice(ini + 1).filter(r => v(r, I.colab)).map(r => {
      const m = v(r, I.data).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/), iso = v(r, I.data).match(/^(\d{4})-(\d{2})-(\d{2})/);
      const data = m ? (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : iso ? iso[0] : '';
      const cs = [...new Set(cats.map(i => v(r, i)).filter(x => x && x !== '-'))];
      const ps = []; prods.forEach(i => v(r, i).split(',').map(x => x.trim()).forEach(x => { if (x && x !== '-' && ps.indexOf(x) < 0) ps.push(x); }));
      return { data, pdv: v(r, I.pdv), cod: v(r, I.cod), rede: v(r, I.rede), canal: v(r, I.canal), uf: v(r, I.uf), colab: v(r, I.colab), montou: v(r, I.montou),
               tipo: v(r, I.tipo), cats: cs.join(', '), prods: ps.join(', '), fotos: v(r, I.foto) };
    });
  }
  function enviarImport(){
    const btn = $('imOk'), LOTE = 300, tot = { novas: 0, repetidas: 0, ignoradas: 0, novosColab: 0 };
    let k = 0;
    const passo = () => {
      if (k >= IMPORT.length) {
        $('imPrev').innerHTML = `<div class="aviso" style="border-color:rgba(34,211,122,.4);background:rgba(34,211,122,.07);color:#bff3d6">Importação concluída: <b>${tot.novas}</b> envios novos, ${tot.repetidas} já existiam, ${tot.ignoradas} ignorados ("não montou" ou sem data)${tot.novosColab ? `, <b>${tot.novosColab}</b> promotores novos na Equipe` : ''}.</div>`;
        return carregar('Importação concluída.');
      }
      btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Enviando ${Math.min(k + LOTE, IMPORT.length)} de ${IMPORT.length}`;
      google.script.run.withSuccessHandler(r => { Object.keys(tot).forEach(x => tot[x] += r[x] || 0); k += LOTE; passo(); })
        .withFailureHandler(e => { btn.disabled = false; btn.textContent = 'Tentar de novo'; toast(esc(e.message), 'erro', 6000); }).importar(CRED.email, CRED.senha, IMPORT.slice(k, k + LOTE));
    };
    passo();
  }

  /* ---------- Acessos e produtos (ADMIN) ---------- */
  function renderAcessos(){
    const per = { ADMIN: 'Administrador', SUPERVISOR: 'Supervisor', BKO: 'BKO', GESTOR: 'Gestor' };
    const C = D.acessosCentral;
    $('v-acessos').innerHTML = `<div class="secao">Cadastro de acessos</div>
      <div class="aviso" style="${C ? 'border-color:rgba(34,211,122,.4);background:rgba(34,211,122,.07);color:#bff3d6' : ''}">${C
        ? '✓ <b>Usando o cadastro único da Central do BI.</b> Para criar, editar ou desativar pessoas, vá na Central › Configurações › Usuários e marque a ferramenta TRI GOLD.'
        : 'Hoje os acessos estão nesta planilha. Para usar o <b>cadastro único</b> (um login para todas as ferramentas, criado na Central), cole abaixo o link da planilha da Central do BI.'}</div>
      <div class="linha-f"><input id="lkCentral" placeholder="https://docs.google.com/spreadsheets/d/…" value=""><button class="btn mini ${C ? 'sec' : ''}" data-acao="ligarCentral" style="flex:0 0 auto">${C ? 'Trocar link' : 'Usar cadastro da Central'}</button>
        ${C ? '<button class="btn mini sec" data-acao="desligarCentral" style="flex:0 0 auto">Voltar ao cadastro local</button>' : ''}</div>
      <div class="secao">Pessoas com acesso à TRI GOLD ${C ? '' : '<button class="btn mini" data-acao="novoAcesso">+ Novo acesso</button>'}</div>
      <div class="bloco">${D.acessos.map((a, k) => `<div class="item" ${C ? 'style="cursor:default;' + (a.ativo ? '' : 'opacity:.45') + '"' : `data-acesso="${k}" style="${a.ativo ? '' : 'opacity:.45'}"`}><div class="ic mono">${esc(a.nome.slice(0, 1))}</div>
        <div class="tx"><b>${esc(a.nome)}</b> <small style="display:inline;color:var(--sub)">· ${per[a.perfil] || a.perfil}${a.ativo ? '' : ' · inativo'}</small><small>${esc(a.email)}${a.perfil === 'BKO' ? ' · confere: ' + esc(a.supervisores || '—') : ''}</small></div></div>`).join('')}</div>
      <div class="secao">Nome dos produtos foco <button class="btn mini" data-acao="salvarProdutos">Salvar</button></div>
      <div class="ajuda">A exportação traz os produtos como código. Dê um nome para aparecer na validação (opcional).</div>
      <div class="bloco" style="margin-top:10px">${Object.keys(D.produtos).concat(D.semProduto).filter((x, i, a) => a.indexOf(x) === i).map(id => `<div class="item" style="cursor:default;align-items:center">
        <div class="tx"><small class="mono">${esc(id)}</small><small>${pl(D.itens.filter(i => i.prods.indexOf(id) >= 0).length, 'envio', 'envios')}</small></div><input data-prod="${esc(id)}" value="${esc(D.produtos[id] || '')}" placeholder="Ex.: Requeijão Copo 200g" style="max-width:260px"></div>`).join('') || '<div class="vazio">Nenhum produto ainda.</div>'}</div>`;
  }
  function formAcesso(a){
    const novo = !a; a = a || { perfil: 'SUPERVISOR', ativo: true, supervisores: '' };
    const marcados = a.supervisores.split(/[,;]/).map(s => s.trim()).filter(Boolean);
    abrirFolha(novo ? 'Novo acesso' : 'Editar acesso', `
      <div class="campo"><label class="l">Nome</label><input id="faNome" value="${esc(a.nome || '')}" placeholder="Como aparece para o time"></div>
      <div class="campo"><label class="l">E-mail</label><input id="faEmail" type="email" value="${esc(a.email || '')}" ${novo ? '' : 'disabled'}></div>
      <div class="campo"><label class="l">Perfil</label><select id="faPerfil">${[['SUPERVISOR', 'Supervisor · valida as fotos do time'], ['BKO', 'BKO · double check das aprovadas'], ['GESTOR', 'Gestor · só consulta'], ['ADMIN', 'Administrador']].map(([k, t]) => `<option value="${k}" ${a.perfil === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="campo" id="faSupBox"><label class="l">Supervisores que este BKO confere</label>${D.supervisores.map(s => `<label class="lembrar" style="margin:6px 0"><input type="checkbox" class="faSup" value="${esc(s)}" ${marcados.indexOf(s) >= 0 ? 'checked' : ''}> ${esc(s)}</label>`).join('')}</div>
      ${novo ? '<div class="ajuda" style="margin-top:12px">A senha é gerada automaticamente e aparece uma única vez.</div>' : `<label class="lembrar" style="margin-top:14px"><input type="checkbox" id="faAtivo" ${a.ativo ? 'checked' : ''}> Acesso ativo</label>`}`,
      novo ? '<button class="btn sec" data-acao="fechar">Cancelar</button><button class="btn" id="faOk">Criar acesso</button>' : '<button class="btn sec" id="faSenha">Gerar nova senha</button><button class="btn" id="faOk">Salvar</button>');
    const vis = () => $('faSupBox').classList.toggle('hidden', $('faPerfil').value !== 'BKO'); $('faPerfil').onchange = vis; vis();
    const dados = extra => Object.assign({ novo, email: novo ? $('faEmail').value.trim() : a.email, nome: $('faNome').value.trim(), perfil: $('faPerfil').value,
      ativo: novo ? true : $('faAtivo').checked, supervisores: [...document.querySelectorAll('.faSup:checked')].map(x => x.value).join(', ') }, extra || {});
    const pos = r => { if (r && r.senha) { const url = location.href.split('#')[0];
      abrirFolha('Acesso criado', `<div class="det"><b>${esc($('faNome') ? $('faNome').value : '')}</b><div class="ajuda">${esc(r.email)}</div><div class="senha-semana" style="margin-top:12px;text-align:center"><span>Senha</span><b>${esc(r.senha)}</b></div>
        <div class="ajuda" style="text-align:center">Essa senha aparece só agora.</div></div>
        <textarea class="rep" id="repTxt" style="height:26vh">Olá!\n\nSeu acesso à validação da Campanha TRI GOLD:\n\nEndereço: ${url}\nUsuário: ${r.email}\nSenha: ${r.senha}\n\nAtenciosamente,\n${D.usuario.nome}\nBI Merchandising | Catupiry</textarea>`,
        '<button class="btn sec" data-acao="fechar">Fechar</button><button class="btn" id="msCop">Copiar mensagem</button>');
      $('msCop').onclick = () => copiar($('repTxt').value, 'Mensagem copiada.'); } else fecharFolha();
      carregar(novo ? 'Acesso criado.' : 'Acesso salvo.'); };
    $('faOk').onclick = e => chamar('salvarAcesso', [dados()], pos, e.currentTarget);
    if ($('faSenha')) $('faSenha').onclick = e => chamar('salvarAcesso', [dados({ gerarSenha: true })], pos, e.currentTarget);
  }
  function copiar(t, msg){
    const ok = () => msg && toast(msg, 'ok');
    const velho = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) {} a.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, velho); else velho();
  }

  /* ---------- Folha ---------- */
  function abrirFolha(t, corpo, rod){ $('fTitulo').innerHTML = t; $('fCorpo').innerHTML = corpo; $('fRod').innerHTML = rod || ''; $('fCorpo').scrollTop = 0; $('fundo').classList.add('on'); $('folha').classList.add('on'); }
  function fecharFolha(){ $('fundo').classList.remove('on'); $('folha').classList.remove('on'); }

  /* ---------- Eventos ---------- */
  $('lgEntrar').onclick = entrar;
  $('lgSenha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  $('lgEmail').addEventListener('keydown', e => { if (e.key === 'Enter') $('lgSenha').focus(); });
  $('btSair').onclick = sair; $('carSair').onclick = sair; $('carTentar').onclick = () => carregar();
  $('btAtualizar').onclick = () => carregar('Atualizado.');
  $('abas').onclick = e => { const b = e.target.closest('.aba'); if (b) irAba(b.dataset.aba); };
  $('fundo').onclick = fecharFolha; $('fFechar').onclick = fecharFolha;
  $('zoom').onclick = () => $('zoom').classList.add('hidden');

  document.body.addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'desfazer') { e.preventDefault(); return desfazer(); }
    if (t.closest('[data-acao="fechar"]')) return fecharFolha();
    const dec = t.closest('[data-dec]'); if (dec) return decidir(dec.dataset.dec);
    const fo = t.closest('[data-foto]'); if (fo) { const i = FILA[POS]; FOTO = (FOTO + Number(fo.dataset.foto) + i.fotos.length) % i.fotos.length; return renderValidar(); }
    const th = t.closest('[data-thumb]'); if (th) { FOTO = Number(th.dataset.thumb); return renderValidar(); }
    if (t.id === 'fotoP') { $('zoomImg').src = t.src; return $('zoom').classList.remove('hidden'); }
    const zo = t.closest('[data-zoom]'); if (zo) { $('zoomImg').src = zo.dataset.zoom; return $('zoom').classList.remove('hidden'); }
    const pu = t.closest('[data-pular]'); if (pu) { if (FILA.length > 1) { POS = (POS + 1) % FILA.length; FOTO = 0; renderValidar(); } return; }
    const et = t.closest('[data-etapa]'); if (et) { ETAPA = et.dataset.etapa; POS = 0; FOTO = 0; montarFila(); renderValidar(); renderAbas(); return; }
    const it = t.closest('[data-item]'); if (it) return detItem(D.itens.find(x => x.id === it.dataset.item));
    const ac = t.closest('[data-acesso]'); if (ac) return formAcesso(D.acessos[Number(ac.dataset.acesso)]);
    const ss = t.closest('[data-salvasenha]'); if (ss) { const s = ss.dataset.salvasenha, v = document.querySelector(`[data-senha="${s}"]`).value.trim().toUpperCase();
      return chamar('salvarSenha', [s, v], () => { D.senhas[s] = v; renderAbas(); toast('Senha da semana ' + semanaTxt(s) + ' salva.', 'ok'); }, ss); }
    const a = t.closest('[data-acao]');
    if (a) {
      const k = a.dataset.acao;
      if (k === 'novoAcesso') return formAcesso();
      if (k === 'ligarCentral') { const v = $('lkCentral').value.trim(); if (!v) return toast('Cole o link da planilha da Central.'); return chamar('ligarCadastroCentral', [v], () => carregar('Cadastro único ligado.'), a); }
      if (k === 'desligarCentral') return chamar('ligarCadastroCentral', [''], () => carregar('Voltou para o cadastro local.'), a);
      if (k === 'salvarRegras') return chamar('salvarRegrasUF', [[...document.querySelectorAll('[data-reguf]')].map(s => ({ uf: s.dataset.reguf, supervisor: s.value }))], () => carregar('Regras salvas.'), a);
      if (k === 'aplicarRegras') { const reg = {}; document.querySelectorAll('[data-reguf]').forEach(s => reg[s.dataset.reguf] = s.value);
        const lista = D.equipe.filter(x => !x.supervisor && reg[x.uf]).map(x => ({ colab: x.colab, supervisor: reg[x.uf] }));
        if (!lista.length) return toast('Ninguém sem supervisor nas UFs com regra.');
        return chamar('salvarEquipe', [lista], () => carregar(pl(lista.length, 'promotor recebeu', 'promotores receberam') + ' supervisor.'), a); }
      if (k === 'salvarEquipe') return chamar('salvarEquipe', [[...document.querySelectorAll('[data-eq]')].map(s => ({ colab: s.dataset.eq, supervisor: s.value }))], () => carregar('Equipe salva.'), a);
      if (k === 'salvarProdutos') return chamar('salvarProdutos', [[...document.querySelectorAll('[data-prod]')].map(i => ({ id: i.dataset.prod, nome: i.value.trim() }))], () => carregar('Produtos salvos.'), a);
    }
    const chip = t.closest('.filtros .chip');
    if (chip && chip.parentElement.dataset.f) { F[chip.parentElement.dataset.f] = chip.dataset.v; return chip.parentElement.dataset.f === 'eqFiltro' ? renderEquipe() : renderEnvios(); }
  });
  document.body.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.f; if (!k || k === 'busca') return;ff1
    F[k] = e.target.value; if (k === 'semana') F.colab = '';
    POS = 0; FOTO = 0; montarFila(); renderValidar(); renderEnvios(); renderAbas();
  });
  let tB; document.body.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.f === 'busca') { F.busca = e.target.value; clearTimeout(tB);
    tB = setTimeout(() => { renderEnvios(); const el = document.querySelector('[data-f="busca"]'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); } });
  document.addEventListener('keydown', e => {
    if (!D || aba !== 'validar' || $('folha').classList.contains('on') || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (!$('zoom').classList.contains('hidden')) { if (e.key === 'Escape') $('zoom').classList.add('hidden'); return; }
    const i = FILA[POS]; if (!i) return;
    if (e.key === 'a' || e.key === 'A') decidir('Aprovada');
    else if (e.key === 'r' || e.key === 'R') decidir('Reprovada');
    else if (e.key === 'ArrowRight' && i.fotos.length > 1) { FOTO = (FOTO + 1) % i.fotos.length; renderValidar(); }
    else if (e.key === 'ArrowLeft' && i.fotos.length > 1) { FOTO = (FOTO - 1 + i.fotos.length) % i.fotos.length; renderValidar(); }
  });

  (function(){ const s = lsGet(K_LOGIN) || lsGet(K_SSO); if (s && s.email && s.senha) { CRED = s; $('lgEmail').value = s.email; carregar(); } else mostrar('login'); })();
</script>
